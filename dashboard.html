<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');

  :root{
    --bg:#F7F9FC; --panel:#FFFFFF; --navy:#24324A; --navy-2:#33445F;
    --amber:#C98224; --teal:#278A75; --red:#B83B36; --slate:#596579; --line:#DDE3EC;
    --purple:#6B5FC7; --pink:#C96FA8; --cyan:#347DBE; --lime:#6FA53D; --gold:#B88925;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:Inter,-apple-system,'Segoe UI',sans-serif;color:var(--navy);
       overflow-x:hidden;}
  .wrap{padding:18px 22px 40px;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @keyframes floatIcon{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-3px) rotate(-4deg);}}
  @keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(95,224,183,.5);}50%{box-shadow:0 0 0 6px rgba(95,224,183,0);}}
  @keyframes gradientShift{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes slideDown{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
  @keyframes modalIn{from{opacity:0;transform:translateY(18px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes overlayIn{from{opacity:0;}to{opacity:1;}}

  /* ---------- NEW: mindblowing extras ---------- */
  @keyframes iconFloat{0%,100%{transform:translateY(0) rotate(0deg) scale(1);}50%{transform:translateY(-5px) rotate(8deg) scale(1.08);}}
  @keyframes iconWiggle{0%,100%{transform:rotate(0deg);}25%{transform:rotate(-12deg);}75%{transform:rotate(12deg);}}
  @keyframes borderFlow{0%{background-position:0% 50%;}100%{background-position:200% 50%;}}
  @keyframes rainbowGlow{
    0%{box-shadow:0 0 0 0 rgba(124,111,224,.0);}
    50%{box-shadow:0 8px 24px -6px rgba(124,111,224,.35);}
    100%{box-shadow:0 0 0 0 rgba(124,111,224,.0);}
  }
  @keyframes sparklePop{
    0%{transform:translate(0,0) scale(0);opacity:1;}
    70%{opacity:1;}
    100%{transform:translate(var(--dx,20px),var(--dy,-30px)) scale(1);opacity:0;}
  }
  @keyframes toastIn{from{opacity:0;transform:translateY(-10px) translateX(-50%);}to{opacity:1;transform:translateY(0) translateX(-50%);}}
  @keyframes toastOut{from{opacity:1;}to{opacity:0;transform:translateY(-10px) translateX(-50%);}}
  @keyframes ringSpin{to{stroke-dashoffset:0;}}
  @keyframes shimmerSweep{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
  @keyframes flashUpdate{
    0%{background:rgba(95,224,183,.35);}
    100%{background:transparent;}
  }
  @keyframes tabGradient{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}

  /* ---------- NEWEST: extra color + icon animation flair ---------- */
  @keyframes iconColorShift{
    0%{filter:hue-rotate(0deg) saturate(1);}
    50%{filter:hue-rotate(35deg) saturate(1.4) brightness(1.08);}
    100%{filter:hue-rotate(0deg) saturate(1);}
  }
  @keyframes iconPop{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.18);}
  }
  @keyframes rainbowText{
    0%{background-position:0% 50%;}
    100%{background-position:200% 50%;}
  }
  @keyframes glowPulse{
    0%,100%{filter:drop-shadow(0 0 0 rgba(124,111,224,0));}
    50%{filter:drop-shadow(0 0 6px rgba(124,111,224,.55));}
  }

  .header{
    background:linear-gradient(120deg,#EAF0F7 0%,#DDE7F2 48%,#F4F7FB 100%);
    background-size:300% 300%;
    animation:fadeUp .5s ease both, gradientShift 6s ease infinite;
    border-radius:16px;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;color:var(--navy);
    box-shadow:0 10px 30px rgba(27,42,74,.22);position:relative;overflow:hidden;
  }
  .header::after{
    content:"";position:absolute;top:0;left:-150%;width:80%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.10),transparent);
    animation:shimmerSweep 5s ease-in-out infinite;
  }
  .header-left{display:flex;align-items:center;gap:12px;}
  .logo{width:42px;height:42px;border-radius:12px;
        background:conic-gradient(from 0deg,var(--amber),var(--pink),var(--cyan),var(--lime),var(--purple),var(--gold),var(--amber));
        display:flex;align-items:center;justify-content:center;font-size:19px;
        animation:floatIcon 3s ease-in-out infinite, spin 8s linear infinite;
        box-shadow:0 4px 18px rgba(227,155,60,.5);}
  .logo span{display:inline-block;animation:iconWiggle 2.2s ease-in-out infinite;}
  .header h1{margin:0;font-size:18px;font-weight:700;
             background:linear-gradient(90deg,var(--navy),var(--purple),var(--cyan),var(--navy));
             background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
             animation:rainbowText 4s linear infinite;}
  .header .sub{margin:2px 0 0;font-size:11.5px;color:#526176;}
  .header-right{display:flex;align-items:center;gap:10px;}
  .updated{font-size:11.5px;color:#526176;background:rgba(255,255,255,.08);padding:6px 12px;border-radius:20px;
            display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.14);
            transition:background .2s;}
  .updated:hover{background:rgba(255,255,255,.16);}
  .dot{width:7px;height:7px;border-radius:50%;background:#5FE0B7;animation:pulseDot 1.8s ease-in-out infinite;}

  /* Auto-refresh ring */
  .refresh-badge{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);
                  border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:5px 12px 5px 8px;
                  font-size:11px;color:#526176;cursor:pointer;transition:background .2s;}
  .refresh-badge:hover{background:rgba(255,255,255,.18);}
  .refresh-badge.spinning .ring-icon{animation:spin .7s linear infinite;}
  .ring-wrap{width:18px;height:18px;position:relative;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-bg{stroke:rgba(255,255,255,.18);}
  .ring-fg{stroke:#5FE0B7;stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
  .ring-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;}

  /* Toast */
  .toast{position:fixed;top:14px;left:50%;background:var(--navy);color:var(--navy);padding:9px 18px;border-radius:30px;
         font-size:12.5px;font-weight:600;box-shadow:0 10px 26px rgba(20,30,60,.3);z-index:100;
         display:flex;align-items:center;gap:8px;animation:toastIn .3s ease both;}
  .toast .dot{background:#5FE0B7;}

  /* ---------- GLOBAL SEARCH (the ONE search bar — across all sheets) ---------- */
  @keyframes rainbowBorder{
    0%{background-position:0% 50%;}
    100%{background-position:200% 50%;}
  }
  .global-search-wrap{
    background:linear-gradient(120deg,#EAF0F7,#DCE6F1 40%,#F3E9F6 70%,#F3F6FA);
    background-size:300% 300%;animation:gradientShift 6s ease infinite, fadeUp .5s ease both .03s;
    border-radius:16px;padding:3px;margin:14px 0 0;box-shadow:0 10px 28px rgba(27,42,74,.22);
    position:relative;
  }
  .global-search-wrap::before{
    content:"";position:absolute;inset:0;border-radius:16px;padding:2px;
    background:linear-gradient(90deg,var(--amber),var(--pink),var(--cyan),var(--lime),var(--purple),var(--amber));
    background-size:250% 100%;animation:rainbowBorder 5s linear infinite;
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.55;
  }
  .global-search-inner{background:transparent;border-radius:14px;padding:13px 16px;}
  .global-search-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;color:var(--navy);font-size:12.5px;font-weight:700;}
  .global-search-head .gicon{font-size:16px;animation:iconFloat 2.6s ease-in-out infinite, iconColorShift 3.5s ease-in-out infinite;}
  .global-search-head .ghint{font-weight:500;color:#526176;font-size:11px;}
  .global-searchbar{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.97);border-radius:11px;
             padding:11px 15px;transition:box-shadow .2s;box-shadow:0 2px 8px rgba(20,30,60,.06);}
  .global-searchbar:focus-within{box-shadow:0 0 0 3px rgba(124,111,224,.3), 0 4px 16px rgba(124,111,224,.2);}
  .global-searchbar input{flex:1;border:none;outline:none;font-size:14px;font-family:inherit;color:var(--navy);
                    background:transparent;}
  .global-searchbar input::placeholder{color:#A8B0C4;}
  .global-searchbar .sicon{font-size:16px;color:var(--purple);animation:iconFloat 4s ease-in-out infinite, iconColorShift 4s ease-in-out infinite;}
  .global-clear{cursor:pointer;font-size:11.5px;color:var(--slate);background:#EEF1F6;border:none;
                border-radius:20px;padding:4px 10px;display:none;transition:background .2s, transform .15s;}
  .global-clear:hover{background:#E2E7F0;transform:scale(1.05);}

  .global-results{display:none;margin-top:12px;background:#fff;border-radius:12px;padding:4px 0;
                   max-height:340px;overflow-y:auto;animation:slideDown .3s ease both;}
  .gresult-empty{padding:22px;text-align:center;color:var(--slate);font-size:12px;}
  .gresult-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);
               cursor:pointer;transition:background .15s ease, transform .15s ease;}
  .gresult-row:last-child{border-bottom:none;}
  .gresult-row:hover{background:#F6F9FF;transform:translateX(3px);}
  .source-badge{font-size:9.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;padding:3px 8px;
                border-radius:20px;white-space:nowrap;flex-shrink:0;}
  .source-badge.office{background:#2C9C8622;color:#2C9C86;}
  .source-badge.client{background:#3E8FD922;color:#3E8FD9;}
  .source-badge.other{background:#7C6FE022;color:#7C6FE0;}
  .source-badge.mobile{background:#E086C122;color:#C96FA8;}
  .source-badge.studio{background:#B8892522;color:#B88925;}
  .source-badge.courier{background:#347DBE22;color:#347DBE;}
  .source-badge.materialin{background:#2FA0C922;color:#2FA0C9;}
  .source-badge.mac_office{background:#3E8FD922;color:#3E8FD9;}
  .source-badge.mac_client{background:#6B5FC722;color:#6B5FC7;}
  .source-badge.mac_firewall{background:#B83B3622;color:#B83B36;}
  .source-badge.laptops{background:#2C9C8622;color:#2C9C86;}
  .gresult-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .gresult-title{font-size:12.5px;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gresult-sub{font-size:11px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gresult-count-pill{background:var(--navy);color:var(--navy);font-size:10.5px;font-weight:700;padding:5px 12px;
                      border-radius:20px;margin-left:8px;}

  /* ---------- STATUS FILTER CHIPS (e.g. Client Laptops: Active/Dispatched) ---------- */
  .status-filter-bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 16px;
                      animation:fadeUp .5s ease both .12s;}
  .status-filter-label{font-size:11px;font-weight:700;color:var(--slate);text-transform:uppercase;
                        letter-spacing:.4px;margin-right:2px;}
  .status-chip{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:20px;
               background:var(--panel);border:1.5px solid var(--line);cursor:pointer;
               font-size:12px;font-weight:700;color:var(--slate);transition:all .2s ease;}
  .status-chip:hover{transform:translateY(-1px);border-color:#C7D0E4;}
  .status-chip .chip-icon{font-size:13px;animation:iconFloat 3s ease-in-out infinite;}
  .status-chip .chip-count{background:rgba(0,0,0,.06);padding:1px 7px;border-radius:20px;font-size:10.5px;}
  .status-chip.active{color:#fff;border-color:transparent;background:var(--accent,var(--navy));
                       box-shadow:0 6px 14px -4px rgba(20,30,60,.35);
                       animation:rainbowGlow 1.6s ease-in-out infinite;}
  .status-chip.active .chip-count{background:rgba(255,255,255,.25);}

  /* Dropdown-style filter (e.g. Client Laptops: Cyntexa Location) */
  .status-dropdown{
    font-family:inherit;font-size:12.5px;font-weight:700;color:var(--navy);
    background:var(--panel);border:1.5px solid var(--line);border-radius:20px;
    padding:8px 14px;cursor:pointer;outline:none;transition:border-color .2s, box-shadow .2s;
    box-shadow:0 1px 3px rgba(20,30,60,.05);
  }
  .status-dropdown:hover{border-color:#C7D0E4;}
  .status-dropdown:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(124,111,224,.18);}

  /* SECTION TABS */
  .section-tabs{display:flex;gap:8px;margin:16px 0 4px;animation:fadeUp .5s ease both .05s;flex-wrap:wrap;}
  .section-tab{display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;background:var(--panel);
               border:1.5px solid var(--line);cursor:pointer;font-size:13px;font-weight:700;color:var(--slate);
               transition:all .2s ease;box-shadow:0 1px 3px rgba(20,30,60,.05);}
  .section-tab:hover{border-color:#C7D0E4;color:var(--navy);transform:translateY(-1px);}
  .section-tab:hover .icon{animation:iconWiggle .5s ease, iconPop .5s ease;}
  .section-tab{position:relative;overflow:hidden;}
  .section-tab::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
    background:var(--tab-accent,var(--navy));transform:scaleX(0);transform-origin:left;
    transition:transform .25s ease;border-radius:3px 3px 0 0;}
  .section-tab.active::after{transform:scaleX(1);}
  #tab-office{--tab-accent:#E3963C;}
  #tab-client{--tab-accent:#3E8FD9;}
  #tab-other{--tab-accent:#7C6FE0;}
  #tab-mobile{--tab-accent:#C96FA8;}
  #tab-studio{--tab-accent:#B88925;}
  #tab-courier{--tab-accent:#347DBE;}
  #tab-materialin{--tab-accent:#2FA0C9;}
  #tab-mac_office{--tab-accent:#3E8FD9;}
  #tab-mac_client{--tab-accent:#6B5FC7;}
  #tab-mac_firewall{--tab-accent:#B83B36;}
  #tab-laptops{--tab-accent:#2C9C86;}
  .section-tab.active{
    background:linear-gradient(120deg,#DCE6F2,#C8D7E8,#E7EEF6);
    background-size:200% 200%;animation:tabGradient 4s ease infinite;
    border-color:var(--tab-accent,var(--navy));color:var(--navy);box-shadow:0 6px 16px rgba(27,42,74,.3);
  }
  .section-tab.active .icon{animation:iconFloat 3s ease-in-out infinite, iconColorShift 3s ease-in-out infinite;}
  .section-tab .icon{font-size:15px;display:inline-block;animation:iconFloat 3.5s ease-in-out infinite;}
  .section-tab .badge-count{font-size:10.5px;background:rgba(0,0,0,.08);padding:1px 8px;border-radius:20px;
    transition:background .2s;}
  .section-tab.active .badge-count{background:var(--tab-accent,rgba(36,50,74,.10));color:#fff;}

  .section{display:none;}
  .section.active{display:block;animation:fadeUp .35s ease both;}


  .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:18px 0;}
  .card{background:var(--panel);border-radius:12px;padding:14px 14px 12px;
        border-top:3px solid transparent;border-left:4px solid var(--accent,var(--navy));
        box-shadow:0 1px 3px rgba(20,30,60,.06);position:relative;overflow:hidden;
        cursor:pointer;animation:fadeUp .5s ease both, idleGlow 5s ease-in-out infinite;
        transition:transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s ease;}
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--accent,var(--navy)),#fff2,var(--accent,var(--navy)));
    background-size:200% 100%;animation:borderFlow 2.5s linear infinite;
  }
  .card::after{content:"";position:absolute;inset:0;
    background:radial-gradient(120px 80px at 90% 0%, var(--accent,var(--navy)) 0%, transparent 70%);
    opacity:0;transition:opacity .3s ease;pointer-events:none;}
  .card:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 16px 32px -8px rgba(20,30,60,.28);}
  .card:hover::after{opacity:.12;}
  .card:hover .card-icon{animation:iconWiggle .5s ease-in-out, iconPop .5s ease-in-out;}
  .card.selected{outline:2px solid var(--accent,var(--navy));outline-offset:-2px;animation:rainbowGlow 1.6s ease-in-out infinite;}
  .card.just-updated{animation:flashUpdate 1.1s ease;}
  .card .label{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--slate);
               display:flex;align-items:center;justify-content:space-between;}
  .card-icon{font-size:16px;transition:transform .28s cubic-bezier(.34,1.56,.64,1);display:inline-block;
             animation:iconFloat 3s ease-in-out infinite, iconColorShift 4.5s ease-in-out infinite;}
  .card .value{font-size:24px;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums;}
  .card .tap-hint{font-size:9.5px;color:var(--slate);margin-top:3px;opacity:.7;}

  @keyframes idleGlow{
    0%,100%{box-shadow:0 1px 3px rgba(20,30,60,.06);}
    50%{box-shadow:0 6px 18px -6px var(--accent,rgba(20,30,60,.2));}
  }

  .grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-bottom:14px;}
  .panel{background:var(--panel);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(20,30,60,.06);
         animation:fadeUp .55s ease both;transition:box-shadow .25s ease;}
  .panel:hover{box-shadow:0 10px 24px -10px rgba(20,30,60,.18);}
  .panel h3{margin:0 0 3px;font-size:13px;display:flex;align-items:center;gap:6px;}
  .panel h3 span{animation:iconFloat 3s ease-in-out infinite;}
  .panel .desc{font-size:11px;color:var(--slate);margin:0 0 10px;}

  .records-section{display:none;overflow:visible;animation:slideDown .35s ease both;}
  /* Keep the full records table reachable; never clip rows at the bottom. */
  .records-section .tbl-wrap{overflow-x:auto;overflow-y:visible;max-height:none;}
  .records-section table{min-width:100%;}
  .records-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
  .records-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;}
  .records-title span:first-child{animation:iconFloat 2.5s ease-in-out infinite, iconColorShift 4s ease-in-out infinite;}
  .records-count{font-size:11px;color:var(--slate);font-weight:500;}
  .close-records{cursor:pointer;background:#EEF1F6;border:none;border-radius:8px;padding:5px 10px;font-size:11px;
                  color:var(--slate);transition:background .2s;}
  .close-records:hover{background:#E2E7F0;}

  table{width:100%;border-collapse:collapse;font-size:12px;}
  thead th{text-align:left;font-size:10px;text-transform:uppercase;color:var(--slate);padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
  tbody tr{transition:background .18s ease, transform .18s ease;cursor:pointer;}
  tbody tr:hover{background:#F6F9FF;transform:translateX(2px);}
  tbody td{padding:9px 8px;border-bottom:1px solid var(--line);}
  .code{font-weight:700;color:var(--navy-2);}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap;
         transition:transform .18s ease;}
  tbody tr:hover .badge{transform:scale(1.08);}
  .no-results{padding:30px;text-align:center;color:var(--slate);font-size:12.5px;}
  .tbl-wrap{overflow-x:auto;}

  .loading{padding:70px;text-align:center;color:var(--slate);font-size:13px;display:flex;flex-direction:column;
            align-items:center;gap:12px;}
  .spinner{width:26px;height:26px;border:3px solid #DCE3F0;border-top-color:var(--purple);border-radius:50%;
           animation:spin .8s linear infinite;}
  .errbox{padding:16px;background:#FBE9E7;color:var(--red);border-radius:10px;font-size:12.5px;animation:fadeUp .3s ease;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(36,50,74,.28);display:flex;align-items:center;justify-content:center;
           z-index:50;animation:overlayIn .2s ease;backdrop-filter:blur(2px);}
  .modal{background:#fff;border-radius:16px;padding:22px 24px 24px;width:420px;max-width:90vw;max-height:80vh;overflow-y:auto;
         box-shadow:0 24px 60px rgba(10,20,40,.35);animation:modalIn .28s cubic-bezier(.2,.8,.2,1);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .modal-head h4{margin:0;font-size:15px;color:var(--navy-2);}
  .modal-close{cursor:pointer;background:#EEF1F6;border:none;border-radius:8px;width:26px;height:26px;font-size:13px;
               color:var(--slate);}
  .modal-close:hover{background:#E2E7F0;}
  .modal-badge{margin-bottom:14px;}
  .detail-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .detail-row:last-child{border-bottom:none;}
  .detail-row .k{color:var(--slate);flex-shrink:0;}
  .detail-row .v{font-weight:600;text-align:right;}

  /* sparkle particles for confetti burst */
  .sparkle{position:fixed;pointer-events:none;font-size:14px;z-index:200;
           animation:sparklePop .8s ease-out forwards;}

  /* ---------- LIGHT / READABLE THEME ---------- */
  body{color:#24324A;}
  .header .sub{color:#526176;}
  .header-right .updated,
  .header-right .refresh-badge{
    color:#526176;
    background:rgba(255,255,255,.72);
    border-color:#CBD6E3;
  }
  .header-right .updated:hover,
  .header-right .refresh-badge:hover{background:#fff;}
  .global-search-head{color:#24324A;}
  .global-search-head .ghint{color:#65748A;}
  .section-tab.active{box-shadow:0 4px 12px rgba(36,50,74,.14);}
  .toast{background:#33445F;color:#fff;}
  .code{color:#33445F;}
  thead th{color:#596579;}
  .panel h3,.card .value{color:#24324A;}
  .modal-head h4{color:#33445F;}
  .detail-row .v{color:#24324A;}

  /* ---------- WORKSPACE PICKER (home screen) ---------- */
  .workspace-view{display:block;}
  .workspace-view.hidden{display:none;}
  .ws-header{
    background:linear-gradient(120deg,#EAF0F7 0%,#DDE7F2 48%,#F4F7FB 100%);
    background-size:300% 300%;animation:fadeUp .5s ease both, gradientShift 6s ease infinite;
    border-radius:16px;padding:26px 28px;box-shadow:0 10px 30px rgba(27,42,74,.22);
    margin-bottom:22px;position:relative;overflow:hidden;
  }
  .ws-header::after{
    content:"";position:absolute;top:0;left:-150%;width:80%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.10),transparent);
    animation:shimmerSweep 5s ease-in-out infinite;
  }
  .ws-header-top{display:flex;align-items:center;gap:12px;}
  .ws-header h1{margin:0;font-size:20px;font-weight:800;
             background:linear-gradient(90deg,var(--navy),var(--purple),var(--cyan),var(--navy));
             background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
             animation:rainbowText 4s linear infinite;}
  .ws-header .sub{margin:4px 0 0;font-size:12.5px;color:#526176;}
  .ws-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
  .ws-card{background:var(--panel);border-radius:16px;padding:20px 20px 18px;cursor:pointer;
           border:1.5px solid var(--line);box-shadow:0 1px 3px rgba(20,30,60,.06);
           transition:transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s ease, border-color .2s;
           position:relative;overflow:hidden;animation:fadeUp .5s ease both;}
  .ws-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg,var(--amber),var(--pink),var(--cyan),var(--lime),var(--purple),var(--amber));
    background-size:250% 100%;animation:rainbowBorder 5s linear infinite;
  }
  .ws-card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 16px 32px -8px rgba(20,30,60,.28);border-color:#C7D0E4;}
  .ws-card:hover .ws-icon{animation:iconWiggle .5s ease-in-out, iconPop .5s ease-in-out;}
  .ws-icon{font-size:30px;display:inline-block;animation:iconFloat 3s ease-in-out infinite, iconColorShift 4.5s ease-in-out infinite;}
  .ws-card h3{margin:12px 0 4px;font-size:15px;font-weight:800;color:var(--navy);}
  .ws-card p{margin:0 0 12px;font-size:11.5px;color:var(--slate);line-height:1.5;}
  .ws-card .ws-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
  .ws-card .ws-tag{font-size:9.5px;font-weight:700;color:var(--slate);background:#EEF1F6;padding:3px 8px;border-radius:20px;}
  .ws-card .ws-enter{font-size:11.5px;font-weight:700;color:var(--purple);display:flex;align-items:center;gap:5px;}
  .ws-card.ws-empty{cursor:default;opacity:.6;border-style:dashed;}
  .ws-card.ws-empty::before{display:none;}
  .ws-card.ws-empty:hover{transform:none;box-shadow:0 1px 3px rgba(20,30,60,.06);border-color:var(--line);}
  .ws-card.ws-empty .ws-enter{color:var(--slate);}

  .back-to-ws{display:flex;align-items:center;gap:7px;cursor:pointer;background:rgba(255,255,255,.72);
              border:1px solid #CBD6E3;border-radius:20px;padding:7px 14px 7px 10px;font-size:12px;
              font-weight:700;color:#526176;transition:background .2s, transform .15s;}
  .back-to-ws:hover{background:#fff;transform:translateX(-2px);}

  /* ---------- ASSET TIMELINE ---------- */
  .asset-timeline-wrap{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
  .asset-timeline-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .asset-timeline-title{font-size:13px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:7px;}
  .asset-timeline-sub{font-size:10.5px;color:var(--slate);margin-top:2px;}
  .timeline-btn{cursor:pointer;border:0;border-radius:8px;background:#33445F;color:#fff;font-weight:700;padding:8px 11px;font-size:11px;transition:transform .15s,box-shadow .15s;}
  .timeline-btn:hover{transform:translateY(-1px);box-shadow:0 5px 12px rgba(36,50,74,.18);}
  .asset-timeline{position:relative;margin:4px 0 2px;padding:4px 0 2px;}
  .asset-timeline::before{content:"";position:absolute;left:16px;top:9px;bottom:9px;width:2px;background:linear-gradient(#C9D4E4,#E7ECF3);border-radius:2px;}
  .timeline-item{position:relative;display:grid;grid-template-columns:34px 1fr;gap:10px;padding:0 0 16px;}
  .timeline-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;border:2px solid #D7DFEA;box-shadow:0 3px 9px rgba(20,30,60,.10);z-index:1;font-size:14px;}
  .timeline-card{background:#F8FAFD;border:1px solid #E1E7EF;border-radius:10px;padding:9px 10px;}
  .timeline-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .timeline-action{font-size:11.5px;font-weight:800;color:var(--navy-2);}
  .timeline-time{font-size:9.5px;color:var(--slate);white-space:nowrap;}
  .timeline-meta{font-size:10px;color:var(--slate);margin-top:3px;line-height:1.45;}
  .timeline-change{margin-top:7px;font-size:10.5px;line-height:1.45;}
  .timeline-old{color:#B83B36;}
  .timeline-new{color:#2C9C86;}
  .timeline-empty{padding:12px;border-radius:9px;background:#F6F8FC;color:var(--slate);font-size:11px;text-align:center;}
  .timeline-loading{padding:16px;text-align:center;color:var(--slate);font-size:11px;background:#F8FAFD;border-radius:9px;}
  .timeline-error{padding:11px;border-radius:9px;background:#FBE9E7;color:var(--red);font-size:11px;}

  /* ---------- AI ASSET ASSISTANT ---------- */
  .ai-assistant-card{margin:18px 0 20px;background:linear-gradient(120deg,#EEF2FF,#F7F4FF 45%,#EDF9F7);border:1px solid #D9DDF2;border-radius:16px;padding:18px 20px;box-shadow:0 10px 26px rgba(36,50,74,.10);position:relative;overflow:hidden;}
  .ai-assistant-card::after{content:"";position:absolute;right:-50px;top:-55px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#7C6FE022,transparent 68%);pointer-events:none;}
  .ai-assistant-top{display:flex;align-items:center;justify-content:space-between;gap:14px;position:relative;z-index:1;}
  .ai-assistant-title{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;color:var(--navy);}
  .ai-assistant-title .ai-icon{font-size:25px;animation:iconFloat 3s ease-in-out infinite,glowPulse 3s ease-in-out infinite;}
  .ai-assistant-sub{font-size:11px;color:var(--slate);margin-top:3px;line-height:1.45;}
  .ai-ask-btn{border:0;border-radius:10px;padding:10px 15px;background:#33445F;color:#fff;font-weight:800;font-size:11.5px;cursor:pointer;box-shadow:0 7px 16px rgba(36,50,74,.18);transition:transform .18s,box-shadow .18s;white-space:nowrap;}
  .ai-ask-btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(36,50,74,.25);}
  .ai-suggestions{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px;position:relative;z-index:1;}
  .ai-suggestion{border:1px solid #D9DDE8;background:#fff;color:#526176;border-radius:20px;padding:7px 10px;font-size:10.5px;cursor:pointer;transition:.18s;}
  .ai-suggestion:hover{border-color:#9D96E3;color:#5F56B8;transform:translateY(-1px);}
  .ai-modal{width:min(760px,94vw);max-height:86vh;padding:0;overflow:hidden;display:flex;flex-direction:column;}
  .ai-modal-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(120deg,#F7F8FC,#F1F0FF);}
  .ai-modal-head h4{margin:0;font-size:15px;color:var(--navy);}
  .ai-modal-head .sub{font-size:10.5px;color:var(--slate);margin-top:3px;}
  .ai-status-dot{width:8px;height:8px;border-radius:50%;background:#5FE0B7;display:inline-block;margin-right:5px;box-shadow:0 0 0 4px #5FE0B722;}
  .ai-chat{padding:16px 18px;overflow-y:auto;min-height:310px;max-height:58vh;background:#FAFBFD;}
  .ai-msg{display:flex;margin:0 0 12px;animation:fadeUp .25s ease both;}
  .ai-msg.user{justify-content:flex-end;}
  .ai-bubble{max-width:86%;padding:10px 12px;border-radius:13px;background:#fff;border:1px solid #E1E6EF;color:#33445F;font-size:11.5px;line-height:1.55;box-shadow:0 2px 7px rgba(20,30,60,.05);white-space:pre-wrap;}
  .ai-msg.user .ai-bubble{background:#33445F;color:#fff;border-color:#33445F;border-bottom-right-radius:4px;}
  .ai-msg.assistant .ai-bubble{border-bottom-left-radius:4px;}
  .ai-result{margin-top:8px;overflow:auto;}
  .ai-result table{font-size:10.5px;background:#fff;}
  .ai-result th,.ai-result td{padding:6px 7px;border-bottom:1px solid #E8ECF2;text-align:left;white-space:nowrap;}
  .ai-result th{font-size:9px;color:var(--slate);text-transform:uppercase;}
  .ai-input-wrap{padding:12px;border-top:1px solid var(--line);background:#fff;display:flex;gap:8px;}
  .ai-input{flex:1;border:1px solid #D8DFEA;border-radius:11px;padding:11px 12px;font-family:inherit;font-size:12px;outline:none;}
  .ai-input:focus{border-color:#7C6FE0;box-shadow:0 0 0 3px #7C6FE022;}
  .ai-send{border:0;border-radius:11px;background:#33445F;color:#fff;padding:0 17px;font-weight:800;cursor:pointer;}
  .ai-send:disabled{opacity:.55;cursor:not-allowed;}
  .ai-typing{display:inline-flex;gap:4px;align-items:center;}
  .ai-typing i{width:5px;height:5px;background:#8B94AC;border-radius:50%;animation:pulseDot 1s infinite;}
  .ai-typing i:nth-child(2){animation-delay:.15s}.ai-typing i:nth-child(3){animation-delay:.3s}
  .ai-admin{margin:0 18px 12px;padding:9px 10px;background:#FFF8E8;border:1px solid #F0DEAE;border-radius:9px;font-size:10.5px;color:#765A1B;}
  .ai-admin input{width:100%;margin-top:7px;border:1px solid #E5D6AE;border-radius:8px;padding:8px;font-family:inherit;font-size:11px;box-sizing:border-box;}
  .ai-admin-actions{display:flex;gap:6px;margin-top:7px;align-items:center;}
  .ai-admin button{border:0;border-radius:7px;padding:6px 9px;font-size:10px;font-weight:700;cursor:pointer;background:#33445F;color:#fff;}
  @media(max-width:700px){.ai-assistant-top{align-items:flex-start;flex-direction:column}.ai-ask-btn{width:100%}.ai-modal{max-height:90vh}.ai-chat{max-height:62vh}}

  /* ============================================================
     C Y N T E X A   I N S P I R E D   P R E M I U M   T H E M E
     Dark charcoal + graphite + warm stone / light-brown accent.
     This block changes presentation only; dashboard JS/functionality
     is intentionally left untouched.
     ============================================================ */

  :root{
    --bg:#090B0E;
    --panel:#12161B;
    --panel-2:#171C22;
    --navy:#F0ECE5;
    --navy-2:#D9D2C7;
    --amber:#B8A58C;
    --teal:#AFA18E;
    --red:#D46A60;
    --slate:#9A9DA2;
    --line:#2A3037;
    --purple:#B8A58C;
    --pink:#C7B9A5;
    --cyan:#9D9A93;
    --lime:#AFA18E;
    --gold:#C2B29C;
    --stone:#B8A58C;
    --cream:#F3EEE6;
    --black:#06080A;
  }

  html{background:var(--bg);}
  body{
    background:
      radial-gradient(circle at 12% 8%, rgba(184,165,140,.09), transparent 25%),
      radial-gradient(circle at 88% 18%, rgba(255,255,255,.035), transparent 24%),
      linear-gradient(135deg,#080A0D 0%,#0D1115 48%,#090B0E 100%);
    color:var(--navy);
  }

  /* Moving diagonal light — subtle reference to the logo background */
  body::before{
    content:"";
    position:fixed;
    inset:-35%;
    pointer-events:none;
    z-index:-1;
    background:
      repeating-linear-gradient(
        125deg,
        transparent 0 95px,
        rgba(255,255,255,.012) 96px 150px,
        transparent 151px 235px
      );
    transform:rotate(-3deg);
    animation:cyntexaDiagonal 18s linear infinite;
  }

  @keyframes cyntexaDiagonal{
    from{transform:translate3d(-3%,0,0) rotate(-3deg);}
    to{transform:translate3d(3%,0,0) rotate(-3deg);}
  }

  @keyframes cyntexaSheen{
    0%{transform:translateX(-120%) skewX(-18deg);opacity:0;}
    15%{opacity:.45;}
    42%{opacity:0;}
    100%{transform:translateX(170%) skewX(-18deg);opacity:0;}
  }

  @keyframes cyntexaGlow{
    0%,100%{box-shadow:0 8px 28px rgba(0,0,0,.28),0 0 0 rgba(184,165,140,0);}
    50%{box-shadow:0 14px 38px rgba(0,0,0,.42),0 0 24px rgba(184,165,140,.10);}
  }

  @keyframes cyntexaFloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-4px);}
  }

  @keyframes cyntexaBorder{
    0%{background-position:0% 50%;}
    100%{background-position:200% 50%;}
  }

  .wrap{padding:18px 22px 40px;}

  /* Header / workspace banner */
  .header,
  .ws-header{
    background:
      linear-gradient(120deg,#07090C 0%,#11161C 42%,#171B20 70%,#0A0C0F 100%);
    background-size:240% 240%;
    border:1px solid #30343A;
    box-shadow:0 16px 42px rgba(0,0,0,.45);
    animation:fadeUp .5s ease both, gradientShift 10s ease infinite, cyntexaGlow 6s ease-in-out infinite;
  }

  .header::before,
  .ws-header::before{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    left:-30%;
    width:24%;
    background:linear-gradient(90deg,transparent,rgba(232,221,207,.13),transparent);
    transform:skewX(-18deg);
    animation:cyntexaSheen 8s ease-in-out infinite;
    pointer-events:none;
  }

  .header::after,
  .ws-header::after{
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.045),transparent);
  }

  .logo{
    background:
      linear-gradient(145deg,#050607,#1A1E23 58%,#2B2925);
    border:1px solid #716A60;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.08),
      0 5px 22px rgba(0,0,0,.45),
      0 0 18px rgba(184,165,140,.12);
    animation:cyntexaFloat 3.4s ease-in-out infinite;
  }

  .logo span{
    filter:grayscale(1) sepia(.25);
    animation:iconWiggle 3.2s ease-in-out infinite;
  }

  .header h1,
  .ws-header h1{
    background:linear-gradient(90deg,#F4EFE7,#B8A58C,#E4D9CA,#F4EFE7);
    background-size:220% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:rainbowText 7s linear infinite;
  }

  .header .sub,
  .ws-header .sub{color:#A5A7AA;}

  .header-right .updated,
  .header-right .refresh-badge{
    color:#D1CBC2;
    background:rgba(255,255,255,.045);
    border:1px solid #343A41;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
  }

  .header-right .updated:hover,
  .header-right .refresh-badge:hover{background:rgba(255,255,255,.08);}

  .dot{background:#C7B9A5;box-shadow:0 0 12px rgba(199,185,165,.35);}

  .ring-bg{stroke:#343A41;}
  .ring-fg{stroke:#C7B9A5;}

  /* Global search */
  .global-search-wrap{
    background:linear-gradient(120deg,#0C1014,#171B20,#211F1C,#0C1014);
    background-size:300% 300%;
    border:1px solid #353A40;
    box-shadow:0 12px 34px rgba(0,0,0,.36);
  }

  .global-search-wrap::before{
    background:linear-gradient(90deg,#71685C,#B8A58C,#E0D5C7,#71685C);
    background-size:250% 100%;
    opacity:.8;
  }

  .global-search-inner{background:transparent;}
  .global-search-head{color:#E9E3DB;}
  .global-search-head .ghint{color:#8F949A;}

  .global-searchbar{
    background:#0E1216;
    border:1px solid #30363D;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.025),0 4px 16px rgba(0,0,0,.22);
  }

  .global-searchbar:focus-within{
    box-shadow:0 0 0 3px rgba(184,165,140,.16),0 8px 24px rgba(0,0,0,.35);
    border-color:#857967;
  }

  .global-searchbar input{color:#EDE8E0;}
  .global-searchbar input::placeholder{color:#737980;}
  .global-searchbar .sicon{color:#C7B9A5;}

  .global-clear{
    color:#B6B8BA;
    background:#242A30;
  }
  .global-clear:hover{background:#30363D;}

  .global-results{
    background:#11161B;
    border:1px solid #2D333A;
    box-shadow:0 18px 40px rgba(0,0,0,.42);
  }
  .gresult-row{border-bottom-color:#272D33;}
  .gresult-row:hover{background:#1A2026;}
  .gresult-title{color:#E8E3DB;}
  .gresult-sub{color:#8E949A;}
  .gresult-count-pill{background:#B8A58C;color:#111;}


  /* Tabs */
  .section-tab{
    background:#11161B;
    border-color:#2D3339;
    color:#A8ADB2;
    box-shadow:0 2px 8px rgba(0,0,0,.20);
  }
  .section-tab:hover{
    border-color:#5A5147;
    color:#EEE9E1;
    background:#171C21;
  }

  .section-tab.active{
    background:linear-gradient(120deg,#1A1E23,#282621,#171B20);
    border-color:#9B8A75;
    color:#F2ECE3;
    box-shadow:0 8px 24px rgba(0,0,0,.42),0 0 18px rgba(184,165,140,.08);
  }

  .section-tab::after{background:linear-gradient(90deg,#71685C,#D1C0A9,#71685C);}
  .section-tab.active .badge-count{background:#B8A58C;color:#111;}

  #tab-office,#tab-client,#tab-other,#tab-mobile,#tab-studio,
  #tab-courier,#tab-materialin,#tab-mac_office,#tab-mac_client,
  #tab-mac_firewall,#tab-laptops{
    --tab-accent:#B8A58C;
  }

  /* Cards / stats */
  .card{
    background:linear-gradient(145deg,#12161B,#171B20);
    border:1px solid #2B3137;
    border-left:4px solid var(--accent,#B8A58C);
    box-shadow:0 5px 18px rgba(0,0,0,.28);
    animation:fadeUp .5s ease both, cyntexaGlow 7s ease-in-out infinite;
  }

  .card::before{
    background:linear-gradient(90deg,transparent,#B8A58C,#F0E8DE,#B8A58C,transparent);
    background-size:200% 100%;
    opacity:.8;
  }

  .card::after{
    background:radial-gradient(140px 90px at 90% 0%,#C7B9A5 0%,transparent 72%);
  }

  .card:hover{
    transform:translateY(-6px) scale(1.02);
    box-shadow:0 20px 42px -12px rgba(0,0,0,.58),0 0 22px rgba(184,165,140,.08);
    border-color:#4A433B;
  }

  .card.selected{
    outline:1px solid #B8A58C;
    box-shadow:0 0 0 1px rgba(184,165,140,.12),0 14px 32px rgba(0,0,0,.45);
  }

  .card .label{color:#91969C;}
  .card .value{color:#F0ECE5;}
  .card .tap-hint{color:#858A90;}
  .card-icon{filter:grayscale(.55) sepia(.18);}

  /* Panels / tables */
  .panel{
    background:linear-gradient(145deg,#12161B,#151A1F);
    border:1px solid #292F35;
    box-shadow:0 5px 18px rgba(0,0,0,.25);
  }
  .panel:hover{
    box-shadow:0 14px 30px -12px rgba(0,0,0,.48);
    border-color:#3A4047;
  }
  .panel h3{color:#ECE7DF;}
  .panel .desc{color:#8E949A;}

  table{color:#D8D3CC;}
  thead th{
    color:#9A9DA2;
    border-bottom-color:#343A40;
  }
  tbody td{border-bottom-color:#292F35;}
  tbody tr:hover{background:#1A2026;}
  .code{color:#E5DED5;}
  .no-results{color:#858B91;}

  .badge{
    border:1px solid rgba(184,165,140,.24);
    filter:saturate(.55);
  }

  /* Filter controls */
  .status-filter-label{color:#8E949A;}
  .status-chip{
    background:#11161B;
    border-color:#2D3339;
    color:#A8ADB2;
  }
  .status-chip:hover{border-color:#5C5349;}
  .status-chip.active{
    color:#111;
    background:linear-gradient(135deg,#B8A58C,#D5C7B7);
    border-color:#D5C7B7;
    box-shadow:0 8px 20px rgba(0,0,0,.35);
  }
  .status-chip .chip-count{background:rgba(255,255,255,.08);}
  .status-chip.active .chip-count{background:rgba(0,0,0,.16);}

  .status-dropdown{
    color:#E8E2D9;
    background:#11161B;
    border-color:#30363C;
  }

  /* ============================================================
     PREMIUM MOTION + MICRO-INTERACTIONS V2
     Extra polish: depth, ambient light, staggered entrances,
     magnetic-feel hovers, focus states and smooth scrolling.
     JS/data/functionality untouched.
     ============================================================ */
  html{scroll-behavior:smooth;}
  ::selection{background:rgba(139,114,216,.18);color:#17181B;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#D9D2EA,#D8B8AD);border:3px solid transparent;background-clip:padding-box;border-radius:999px;}
  ::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#BCA9DF,#D39A86);border:3px solid transparent;background-clip:padding-box;}

  body{position:relative;}
  body::before,body::after{
    content:"";position:fixed;pointer-events:none;z-index:-1;border-radius:50%;
    filter:blur(55px);will-change:transform;opacity:.48;
  }
  body::before{
    width:360px;height:360px;left:-170px;top:28vh;
    background:radial-gradient(circle,#DCCBFA 0%,rgba(220,203,250,0) 70%);
    animation:ambientOne 15s ease-in-out infinite;
  }
  body::after{
    width:330px;height:330px;right:-145px;top:58vh;
    background:radial-gradient(circle,#FFD5C7 0%,rgba(255,213,199,0) 70%);
    animation:ambientTwo 18s ease-in-out infinite;
  }
  @keyframes ambientOne{0%,100%{transform:translate3d(0,0,0) scale(1)}35%{transform:translate3d(70px,-35px,0) scale(1.08)}70%{transform:translate3d(25px,80px,0) scale(.94)}}
  @keyframes ambientTwo{0%,100%{transform:translate3d(0,0,0) scale(1)}40%{transform:translate3d(-60px,-55px,0) scale(1.1)}75%{transform:translate3d(-15px,55px,0) scale(.95)}}
  @keyframes softGlow{0%,100%{box-shadow:0 8px 28px rgba(39,38,44,.055),0 0 0 rgba(139,114,216,0)}50%{box-shadow:0 12px 32px rgba(39,38,44,.075),0 0 28px rgba(139,114,216,.045)}}
  @keyframes iconBreath{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.035)}}
  @keyframes lineFlow{0%{background-position:0% 50%}100%{background-position:200% 50%}}
  @keyframes buttonSheen{0%{left:-120%}35%,100%{left:140%}}
  @keyframes tabIn{from{opacity:.65;transform:translateY(2px) scale(.985)}to{opacity:1;transform:none}}

  /* More natural page entrance instead of everything arriving at once */
  .ws-grid .ws-card:nth-child(1),.stats .card:nth-child(1),.grid2 .panel:nth-child(1){animation-delay:.04s!important;}
  .ws-grid .ws-card:nth-child(2),.stats .card:nth-child(2),.grid2 .panel:nth-child(2){animation-delay:.09s!important;}
  .ws-grid .ws-card:nth-child(3),.stats .card:nth-child(3),.grid2 .panel:nth-child(3){animation-delay:.14s!important;}

  .ws-grid .ws-card:nth-child(5),.stats .card:nth-child(5),.grid2 .panel:nth-child(5){animation-delay:.24s!important;}
  .ws-grid .ws-card:nth-child(n+6),.stats .card:nth-child(n+6){animation-delay:.28s!important;}

  /* Give glass surfaces a moving, almost invisible light source */
  .ws-card,.card,.panel,.asset-timeline-wrap,.ai-assistant-card{
    position:relative;isolation:isolate;
  }
  .ws-card::after,.card::before,.panel::after,.asset-timeline-wrap::after,.ai-assistant-card::after{
    pointer-events:none;
  }

.global-search-wrap::before,.global-search-wrap::after,
.card::before,.card::after,.panel::before,.panel::after,
.ws-card::before,.ws-card::after{animation:none!important;}
/* Remove expensive filter/blur from scrolling content; retain modal overlay blur only. */
.wrap .header,.wrap .ws-header,.global-search-wrap,.section-tabs,
.ws-card,.card,.panel,.asset-timeline-wrap,.timeline-card,.section,
#section-activity_logs{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;filter:none!important;}
/* Static glass appearance. */
.ws-card,.card,.panel,.asset-timeline-wrap,.timeline-card{
  background:rgba(255,255,255,.94)!important;
  box-shadow:0 8px 24px rgba(55,35,80,.07)!important;
}
/* Lightweight interaction only: transform/shadow, no filter/blur. */
.ws-card,.card,.panel,.section-tab,.ws-enter,button,input,select,textarea{
  transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease,background-color .14s ease!important;
}
/* Activity Logs: totally inert visually, including parent surfaces. */
#section-activity_logs,#section-activity_logs *,
#section-activity_logs .panel:hover,#section-activity_logs .records-section:hover,
#section-activity_logs .tbl-wrap:hover,#section-activity_logs table tbody tr:hover,
#section-activity_logs table tbody tr:hover td{
  animation:none!important;transform:none!important;filter:none!important;
  transition:none!important;box-shadow:none!important;
}
/* Do not animate counters or refresh flashes. */
.just-updated{animation:none!important;box-shadow:none!important;}
/* Keep only intentional modal blur, limited to a small surface. */
.overlay{backdrop-filter:blur(6px)!important;-webkit-backdrop-filter:blur(6px)!important;}
/* No scroll-time JS class work and no expensive scroll effects. */
.is-scrolling .ws-card,.is-scrolling .card,.is-scrolling .panel{transition:none!important;}
/* Fast, native-feeling scrollbar. */
*{scrollbar-width:thin;}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important;}}
</style>

<script id="cyntexa-splash-controller">
(function(){
  var started=Date.now(), ready=false, minimum=650, hidden=false;
  window.hideCyntexaSplash_=function(){
    ready=true;
    var wait=Math.max(0,minimum-(Date.now()-started));
    setTimeout(function(){
      if(hidden)return; hidden=true;
      var s=document.getElementById('cyntexaSplash');
      if(!s)return;
      var status=document.getElementById('cyntexaSplashStatus');
      if(status)status.textContent='Workspace ready';
      s.classList.add('is-leaving');
      setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},300);
    },wait);
  };
})();
</script>

   * ------------------------------------------------------------ */
  function getDisplayAssetCode(s, r) {

  var AUTO_REFRESH_SECONDS = 30;

  var RING_CIRCUMFERENCE = 2 * Math.PI * 7; // r=7

  function animateValue(el, end, duration) {
    var start = 0, startTime = null;
    function step(ts) {
      if (!startTime) startTime = ts;
      var progress = Math.min((ts - startTime) / duration, 1);
      var eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = Math.round(eased * end);
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function esc(v) {
    if (v === null || v === undefined) return "";

  function burstSparkles(x, y) {
    for (var i = 0; i < 8; i++) {
      var el = document.createElement("div");
      el.className = "sparkle";
      el.textContent = SPARKLE_EMOJI[Math.floor(Math.random() * SPARKLE_EMOJI.length)];
      var angle = Math.random() * Math.PI * 2;
      var dist = 30 + Math.random() * 40;
      el.style.setProperty("--dx", (Math.cos(angle) * dist) + "px");
      el.style.setProperty("--dy", (Math.sin(angle) * dist) + "px");
      el.style.left = x + "px";
      el.style.top = y + "px";
      document.body.appendChild(el);
      (function (node) { setTimeout(function () { node.remove(); }, 850); })(el);

    clearTimeout(toastTimer);

  // Creates the separate audit-log workbook (once) and installs edit

  function toggleActivityReportMode_() {
    var mode = document.getElementById('activityReportMode');
    var dateInput = document.getElementById('activityReportDate');
    var monthInput = document.getElementById('activityReportMonth');
    var hint = document.getElementById('activityReportHint');
    if (!mode || !dateInput || !monthInput) return;
    var monthly = mode.value === 'monthly';
    dateInput.style.display = monthly ? 'none' : 'inline-block';
    monthInput.style.display = monthly ? 'inline-block' : 'none';
    if (hint) hint.textContent = monthly ? 'Choose a month to download that month\'s logs.' : 'Choose a date to download that day\'s logs.';
  }

  function downloadActivityLogReport_() {
    var modeEl = document.getElementById('activityReportMode');
    var dateEl = document.getElementById('activityReportDate');
    var monthEl = document.getElementById('activityReportMonth');
    var button = document.getElementById('activityReportDownload');
    if (!modeEl || !button) return;
    var mode = modeEl.value || 'daily';
    var value = mode === 'monthly' ? (monthEl ? monthEl.value : '') : (dateEl ? dateEl.value : '');
    if (!value) {
      showToast(mode === 'monthly' ? 'Please select a month' : 'Please select a date');
      return;
    }
    button.disabled = true;
    button.textContent = 'Preparing Excel…';
    google.script.run
      .withSuccessHandler(function (result) {
        button.disabled = false;
        button.textContent = '⬇ Download Excel';
        if (!result || !result.ok || !result.base64) {
          showToast('Could not create the Excel report');
          return;
        }
        try {
          var binary = atob(result.base64), bytes = new Uint8Array(binary.length);
          for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          var blob = new Blob([bytes], { type: result.mimeType || 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
          var url = URL.createObjectURL(blob), link = document.createElement('a');
          link.href = url;
          link.download = result.filename || ('Activity_Logs_' + mode + '_' + value + '.xlsx');
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
          showToast(result.count + ' log' + (result.count === 1 ? '' : 's') + ' exported ✓');
        } catch (e) {
          showToast('Excel download failed');
        }
      })
      .withFailureHandler(function (error) {
        button.disabled = false;
        button.textContent = '⬇ Download Excel';
        showToast((error && error.message) || 'Could not create the Excel report');
      })
      .downloadActivityLogReport({ mode: mode, value: value });
  }

  /* ============================================================
   * PRELOAD — silently warms dashboard data in the background. The
   * first/visible tab is prioritized; remaining tabs are loaded after
   * a short delay so opening a workspace is not blocked by every sheet.
   * SHEET_DATA/SECTION_INDEX are kept in sync for Global Search.
   * ============================================================ */
  var SHEET_DATA = {};     // sectionId -> latest data
  var SECTION_INDEX = {};  // sectionId -> { workspace, section }

  var preloadQueue_ = [];
  var preloadActive_ = 0;
  var preloadToken_ = 0;
  var PRELOAD_CONCURRENCY_ = 4;

  function preloadAllSections() {
    preloadToken_++;
    var token = preloadToken_;

    // Index every section first so Global Search and workspace switching can
    // immediately find the correct cached dataset.
    var firstSections = [];
    var otherSections = [];

    WORKSPACES.forEach(function (w) {
      (w.sections || []).forEach(function (s, index) {
        SECTION_INDEX[s.id] = { workspace: w, section: s };
        if (s.adminOnly && !CURRENT_USER_IS_ADMIN) return;
        if (index === 0) firstSections.push(s);
        else otherSections.push(s);
      });
    });

    // IMPORTANT: fetch ALL workspaces + ALL tabs automatically at startup.
    // First tabs get priority, then every remaining tab is fetched through a
    // small parallel queue. Data is cached only; hidden tabs are not rendered,
    // so startup stays smooth while the data becomes available early.
    preloadQueue_ = firstSections.concat(otherSections).filter(function (s) {
      return s && !SHEET_DATA[s.id] && !SECTION_LOADING[s.id];
    });
    preloadActive_ = 0;

    pumpPreload_(token);
  }

  function pumpPreload_(token) {
    if (token !== preloadToken_) return;

    while (preloadActive_ < PRELOAD_CONCURRENCY_ && preloadQueue_.length) {
      var s = preloadQueue_.shift();
      if (!s || SHEET_DATA[s.id] || SECTION_LOADING[s.id]) continue;

      preloadActive_++;
      SECTION_LOADING[s.id] = true;

      (function(section) {
        google.script.run
          .withSuccessHandler(function (data) {
            preloadActive_ = Math.max(0, preloadActive_ - 1);
            SECTION_LOADING[section.id] = false;

            if (data && !data.error) {
              data._loadedAt = Date.now();
              SHEET_DATA[section.id] = data;

              // Only render if this section is already visible. Otherwise the
              // full dataset remains cached for instant tab switching/search.
              if (activeWorkspace && activeWorkspace.sections.some(function (x) {
                return x.id === section.id;
              }) && document.getElementById('section-' + section.id)) {
                onSectionData(section, data);
              }
            }

            setTimeout(function () { pumpPreload_(token); }, 0);
          })
          .withFailureHandler(function () {
            preloadActive_ = Math.max(0, preloadActive_ - 1);
            SECTION_LOADING[section.id] = false;
            // Continue the queue even if one sheet fails.
            setTimeout(function () { pumpPreload_(token); }, 0);
          })
          [section.fetchFn]();
      })(s);
    }
  }

  /* ============================================================
   * OPEN / CLOSE A WORKSPACE
   * ------------------------------------------------------------
   * FIX: previously this only called buildWorkspaceDashboard() the
   * FIRST time a workspace was opened (guarded by workspaceBooted),
   * and every later click just un-hid whatever HTML was already
   * sitting inside the shared #dashboardView div. Since BOTH
   * workspaces render into that same div, if you opened Asset
   * Register and then MAC Address, the MAC click could end up
   * re-showing stale Asset Register markup instead of rebuilding
   * its own. Now it always rebuilds the dashboard for the clicked
   * workspace, so the right one is guaranteed to show every time.
   * ============================================================ */
  function openWorkspace(wsId) {
    var w = WORKSPACES.filter(function (x) { return x.id === wsId; })[0];
    if (!w) return;

    // If this workspace is already mounted, reuse its DOM. Rebuilding the whole
    // dashboard on every global-search selection was a major source of freezes.
    if (activeWorkspace && activeWorkspace.id === wsId && workspaceBooted[wsId]) {
      document.getElementById('workspacePicker').classList.add('hidden');
      document.getElementById('dashboardView').classList.remove('hidden');
      return;
    }

    activeWorkspace = w;
    document.getElementById('workspacePicker').classList.add('hidden');
    var dv = document.getElementById('dashboardView');
    dv.classList.remove('hidden');
    window.scrollTo(0, 0);
    buildWorkspaceDashboard(w);
    workspaceBooted[wsId] = true;
  }

  function backToWorkspaces() {
    document.getElementById('dashboardView').classList.add('hidden');
    document.getElementById('workspacePicker').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });

  function buildWorkspaceDashboard(w) {
    var SECTIONS_LOCAL = w.sections.filter(function (s) { return !s.adminOnly || CURRENT_USER_IS_ADMIN; });

    var tabsHtml = SECTIONS_LOCAL.map(function (s) {

      '<div class="header">' +
      '<div class="header-left">' +
      '<div class="logo"><span>' + w.icon + '</span></div>' +
      '<div><h1>' + esc(w.title) + '</h1><p class="sub">Live from Google Sheets</p></div>' +
      '</div>' +
      '<div class="header-right">' +
      '<div class="back-to-ws" onclick="backToWorkspaces()">← Workspaces</div>' +
      '<div class="refresh-badge" id="refreshBadge" onclick="manualRefresh()" title="Click to refresh now">' +
      '  <div class="ring-wrap">' +
      '    <svg width="18" height="18" viewBox="0 0 18 18">' +
      '      <circle class="ring-bg" cx="9" cy="9" r="7" fill="none" stroke-width="2"></circle>' +
      '      <circle class="ring-fg" id="ringFg" cx="9" cy="9" r="7" fill="none" stroke-width="2" ' +
      '        stroke-dasharray="' + RING_CIRCUMFERENCE + '" stroke-dashoffset="0"></circle>' +
      '    </svg>' +
      '    <span class="ring-icon" id="ringIcon">🔄</span>' +
      '  </div>' +
      '  <span id="refreshLabel">Refreshing in 30s</span>' +
      '</div>' +
      '<div class="updated" id="globalUpdated"><span class="dot"></span>Loading…</div>' +
      '</div>' +
      '</div>' +
      '<div class="global-search-wrap">' +
      '<div class="global-search-inner">' +
      '  <div class="global-search-head"><span class="gicon"></span></div>' +
      '  <div class="global-searchbar">' +
      '    <span class="sicon">🔎</span>' +
      '    <input id="globalSearchInput" type="text" placeholder="" oninput="onGlobalSearch()">' +
      '    <button class="global-clear" id="globalClearBtn" onclick="clearGlobalSearch()">Clear ✕</button>' +
      '  </div>' +
      '  <div class="global-results" id="globalResults"></div>' +
      '</div>' +
      '</div>' +
      '<div class="section-tabs">' + tabsHtml + '</div>' +
      sectionsHtml;

    // PERFORMANCE: paint ONLY the active section. Data for other sections may
    // already be cached, but creating their cards/tables/charts here can freeze
    // the browser on large workspaces. Hidden sections are painted on demand.
    var first = SECTIONS_LOCAL[0];
    if (first) {
      if (SHEET_DATA[first.id] && !SHEET_DATA[first.id].error) {
        onSectionData(first, SHEET_DATA[first.id]);
      } else {
        loadSection(first, true);
      }
    }

    startAutoRefresh();
    startActivityLogRealtimeSync_();
  }

  var workspaceWarmQueue_ = [];
  var workspaceWarmActive_ = 0;
  var workspaceWarmToken_ = 0;

  function warmWorkspaceSections_(w) {
    workspaceWarmToken_++;
    var token = workspaceWarmToken_;
    workspaceWarmQueue_ = (w.sections || []).filter(function(s){
      return (!s.adminOnly || CURRENT_USER_IS_ADMIN) && !SHEET_DATA[s.id] && !SECTION_LOADING[s.id];
    }).slice(1);
    workspaceWarmActive_ = 0;

    // Give the visible section a short head start, then fetch hidden tabs with
    // limited concurrency. Apps Script calls remain parallel enough to reduce
    // waiting, but not so parallel that the browser/server gets flooded.
    setTimeout(function(){ pumpWorkspaceWarm_(token); }, 120);
  }

  function pumpWorkspaceWarm_(token) {
    if (token !== workspaceWarmToken_) return;
    if (!activeWorkspace || workspaceWarmQueue_.length === 0) return;

    while (workspaceWarmActive_ < 2 && workspaceWarmQueue_.length) {
      var s = workspaceWarmQueue_.shift();
      if (!s || SHEET_DATA[s.id] || SECTION_LOADING[s.id]) continue;
      workspaceWarmActive_++;
      SECTION_LOADING[s.id] = true;

      (function(section){
        google.script.run
          .withSuccessHandler(function(data){
            workspaceWarmActive_ = Math.max(0, workspaceWarmActive_ - 1);
            // Do not render hidden tabs. Cache only.
            if (data && !data.error) {
              data._loadedAt = Date.now();
              SHEET_DATA[section.id] = data;
            }
            SECTION_LOADING[section.id] = false;
            setTimeout(function(){ pumpWorkspaceWarm_(token); }, 0);
          })
          .withFailureHandler(function(){
            workspaceWarmActive_ = Math.max(0, workspaceWarmActive_ - 1);
            SECTION_LOADING[section.id] = false;
            setTimeout(function(){ pumpWorkspaceWarm_(token); }, 0);
          })
          [section.fetchFn]();
      })(s);
    }
  }

  function switchSection(id) {
    activeSection = id;
    document.querySelectorAll('.section-tab').forEach(function (t) {
      t.classList.toggle('active', t.id === 'tab-' + id);
    });
    document.querySelectorAll('.section').forEach(function (sec) {
      sec.classList.toggle('active', sec.id === 'section-' + id);
    });
    var s = activeWorkspace.sections.filter(function (x) { return x.id === id; })[0];
    var cached = SECTION_STATE[id] && SECTION_STATE[id].data;
    var fresh = cached && cached._loadedAt && (Date.now() - cached._loadedAt < 12000);
    if (cached && !cached.error) {
      if (s.showCharts && SECTION_STATE[id].chartsReady !== true) renderCharts(s);
      // Activity Logs: show cached data instantly; realtime sync will update it.
      if (id === 'activity_logs' && !fresh) loadSection(s, true);
    } else if (SHEET_DATA[id] && !SHEET_DATA[id].error) {
      // V20: a background-warmed tab is already available — paint it immediately
      // instead of making the user wait for another Apps Script round trip.
      onSectionData(s, SHEET_DATA[id]);
    } else {
      loadSection(s, true);
    }
  }

  function loadSection(s, isVisible) {
    if (!s || !s.id) return;
    if (SECTION_LOADING[s.id]) return;

    SECTION_LOADING[s.id] = true;
    google.script.run
      .withSuccessHandler(function (data) {
        SECTION_LOADING[s.id] = false;
        if (!data || data.error) {
          onSectionError(s, data || { message: 'Could not load data.' });
          return;
        }
        data._loadedAt = Date.now();
        SHEET_DATA[s.id] = data;
        onSectionData(s, data);

        if (s.id === 'activity_logs') {
          google.script.run
            .withSuccessHandler(function (v) {
              if (v) activityLogVersion = v;
            })
            .withFailureHandler(function () {})
            .getActivityLogVersion();
        }
      })
      .withFailureHandler(function (err) {
        SECTION_LOADING[s.id] = false;
        onSectionError(s, err);
      })
      [s.fetchFn]();
  }

  function onSectionError(s, err) {
    var box = document.getElementById('section-' + s.id);
    if (box) box.innerHTML = '<div class="errbox">Could not load ' + s.title + ': ' + (err.message || err) + '</div>';
  }

    if (!data._search) data._search = (data.records || []).map(function(r){ return (String(r.empId||'') + " " + getRecordEmpName(s.id,r) + " " + String(r.code||'') + " " + getRecordExtraHaystack(s.id,r)).toUpperCase(); });
    data._loadedAt = data._loadedAt || Date.now();

    document.getElementById('tabcount-' + s.id).textContent = data.total;
    document.getElementById('globalUpdated').innerHTML = '<span class="dot"></span>' + s.title + ' updated ' + data.updated;

    var cardsHtml = '';
