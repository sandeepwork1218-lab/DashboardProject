  function renderCharts(s) {
    if (!s.showCharts) return;
    var state = SECTION_STATE[s.id];
    if (!state) return;
    var counts = state.data.counts;
    var labels = Object.keys(counts);
    var values = labels.map(function (l) { return counts[l]; });
    var colors = labels.map(function (l) { return metaFor(l).color; });

    if (!state.charts) state.charts = {};
    if (state.charts.bar) state.charts.bar.destroy();
    if (state.charts.pie) state.charts.pie.destroy();

    var barCanvas = document.getElementById('bar-' + s.id);
    var pieCanvas = document.getElementById('pie-' + s.id);
    if (!barCanvas || !pieCanvas) return;

    state.charts.bar = new Chart(barCanvas, {
      type: 'bar',
      data: { labels: labels, datasets: [{ data: values, backgroundColor: colors, borderRadius: 7, barThickness: 30 }] },
      options: {
        animation: false,
        onClick: function (evt, els) { if (els.length) openRecords(s.id, labels[els[0].index], evt.native); },
        plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1B2A4A', padding: 10, cornerRadius: 8, displayColors: false } },
        scales: { y: { beginAtZero: true, grid: { color: "#EEF1F6" } }, x: { grid: { display: false } } },
        onHover: function (evt, els) { evt.native.target.style.cursor = els.length ? 'pointer' : 'default'; }
      }
    });

    state.charts.pie = new Chart(pieCanvas, {
      type: 'doughnut',
      data: { labels: labels, datasets: [{ data: values, backgroundColor: colors, borderWidth: 3, borderColor: "#fff", hoverOffset: 10 }] },
      options: {
        cutout: '62%',
        animation: false,
        onClick: function (evt, els) { if (els.length) openRecords(s.id, labels[els[0].index], evt.native); },
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }, tooltip: { backgroundColor: '#1B2A4A', padding: 10, cornerRadius: 8, displayColors: false } },
        onHover: function (evt, els) { evt.native.target.style.cursor = els.length ? 'pointer' : 'default'; }
      }
    });
  }

  function openRecords(sectionId, status, evt) {
    if (evt) burstSparkles(evt.clientX, evt.clientY);
    var state = SECTION_STATE[sectionId];
    state.currentFilter = (status === '__ALL__') ? null : status;

    document.querySelectorAll('#section-' + sectionId + ' .card').forEach(function (c) {
      c.classList.toggle('selected', c.getAttribute('data-status') === status);
    });
    var s = activeWorkspace.sections.filter(function (x) { return x.id === sectionId; })[0];
    var m = state.currentFilter ? metaFor(state.currentFilter) : { icon: s.icon };
    document.getElementById('recIcon-' + sectionId).textContent = m.icon;
    document.getElementById('recTitle-' + sectionId).textContent = state.currentFilter ? (state.currentFilter + ' Items') : ('All ' + s.title);
    document.getElementById('records-' + sectionId).style.display = 'block';
    renderTable(sectionId);
    document.getElementById('records-' + sectionId).scrollIntoView({ behavior: 'auto', block: 'start' });
  }

  function closeRecords(sectionId) {
    document.getElementById('records-' + sectionId).style.display = 'none';
    document.querySelectorAll('#section-' + sectionId + ' .card').forEach(function (c) { c.classList.remove('selected'); });
    SECTION_STATE[sectionId].currentFilter = null;
    SECTION_STATE[sectionId].statusFilter = null;
    var s = activeWorkspace.sections.filter(function (x) { return x.id === sectionId; })[0];
    if (s.statusFilterType === 'dropdown') {
      var dd = document.getElementById('statusDropdown-' + sectionId);
      if (dd) dd.value = '__ALL__';
    } else {
      document.querySelectorAll('#statusFilter-' + sectionId + ' .status-chip').forEach(function (c) {
        c.classList.toggle('active', c.getAttribute('data-sf') === '__ALL__');
      });
    }
  }

  function toggleStatusFilter(sectionId, status) {
    var state = SECTION_STATE[sectionId];
    if (!state) return;
    var s = activeWorkspace.sections.filter(function (x) { return x.id === sectionId; })[0];

    var newVal = (status === '__ALL__') ? null : status;
    if (state.statusFilter === newVal) newVal = null; // clicking the same chip again clears it
    state.statusFilter = newVal;

    document.querySelectorAll('#statusFilter-' + sectionId + ' .status-chip').forEach(function (c) {
      var cs = c.getAttribute('data-sf');
      var isActive = newVal === null ? (cs === '__ALL__') : (cs === newVal);
      c.classList.toggle('active', isActive);
    });

    var recordsBox = document.getElementById('records-' + sectionId);
    if (recordsBox.style.display !== 'block') {
      document.getElementById('recTitle-' + sectionId).textContent = state.currentFilter ? (state.currentFilter + ' Items') : ('All ' + s.title);
      document.getElementById('recIcon-' + sectionId).textContent = state.currentFilter ? metaFor(state.currentFilter).icon : s.icon;
      recordsBox.style.display = 'block';
    }
    renderTable(sectionId);
    recordsBox.scrollIntoView({ behavior: 'auto', block: 'start' });
  }

  function onDropdownFilterChange(sectionId) {
    var select = document.getElementById('statusDropdown-' + sectionId);
    var state = SECTION_STATE[sectionId];
    if (!state || !select) return;
    var val = select.value;
    state.statusFilter = (val === '__ALL__') ? null : val;

    var s = activeWorkspace.sections.filter(function (x) { return x.id === sectionId; })[0];
    var recordsBox = document.getElementById('records-' + sectionId);
    if (recordsBox.style.display !== 'block') {
      document.getElementById('recTitle-' + sectionId).textContent = state.currentFilter ? (state.currentFilter + ' Items') : ('All ' + s.title);
      document.getElementById('recIcon-' + sectionId).textContent = state.currentFilter ? metaFor(state.currentFilter).icon : s.icon;
      recordsBox.style.display = 'block';
    }
    renderTable(sectionId);
    recordsBox.scrollIntoView({ behavior: 'auto', block: 'start' });
  }

  function addAccessUser_() {
    var input = document.getElementById('accessEmailInput');
    if (!input) return;
    var email = input.value.trim();
    if (!email) { showToast('Enter an email address'); return; }
    input.disabled = true;
    google.script.run
      .withSuccessHandler(function (r) {
        input.disabled = false;
        if (r && r.ok) {
          input.value = '';
          showToast('Access added ✓');
          loadSection(SECTION_INDEX.access.section, true);
        }
      })
      .withFailureHandler(function (e) {
        input.disabled = false;
        showToast((e && e.message) || 'Could not add access');
      })
      .addDashboardAuthorizedEmail(email);
  }

  function removeAccessUser_(email) {
    if (!confirm('Remove dashboard access for ' + email + '?')) return;
    google.script.run
      .withSuccessHandler(function () {
        showToast('Access removed ✓');
        loadSection(SECTION_INDEX.access.section, true);
      })
      .withFailureHandler(function (e) { showToast((e && e.message) || 'Could not remove access'); })
      .removeDashboardAuthorizedEmail(email);
  }

  function renderAccessTable_() {
    var state = SECTION_STATE.access;
    if (!state) return;
    var list = state.data.records || [];
    document.getElementById('recCount-access').textContent = list.length + ' authorized user' + (list.length === 1 ? '' : 's');
    var body = document.getElementById('recBody-access');
    var noRes = document.getElementById('noResults-access');
    if (!list.length) {
      body.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:24px;color:#7A8496">No users added yet. Add an email above.</td></tr>';
      noRes.style.display = 'none';
      return;
    }
    noRes.style.display = 'none';
    body.innerHTML = list.map(function (r) {
      return '<tr>' +
        '<td class="code">' + esc(r.email) + '</td>' +
        '<td>' + esc(r.email) + '</td>' +
        '<td><span class="badge" style="' + badgeStyle('AUTHORIZED') + '">✓ AUTHORIZED</span></td>' +
        '<td style="text-align:right"><button type="button" onclick="event.stopPropagation();removeAccessUser_(\'' + esc(r.email).replace(/'/g, "\\'") + '\')" style="cursor:pointer;border:0;border-radius:7px;background:#FDECEC;color:#B42318;font-weight:700;padding:7px 10px;font-size:12px;">Remove</button></td>' +
        '</tr>';
    }).join('');
    state.currentList = list;
  }

  function renderTable(sectionId) {
    var s = activeWorkspace.sections.filter(function (x) { return x.id === sectionId; })[0];
    if (s && s.accessManager) { renderAccessTable_(); return; }
    var state = SECTION_STATE[sectionId];
    var gKey = s.groupField || 'status';

    var list = state.data.records.filter(function (r) {
      var groupOk = (s.flatList || !state.currentFilter) ? true : r[gKey] === state.currentFilter;
      if (!groupOk) return false;
      if (s.statusFilterField && state.statusFilter) {
        var sfOk = String(r[s.statusFilterField] || 'UNKNOWN').trim().toUpperCase() === state.statusFilter;
        if (!sfOk) return false;
      }
      return true;
    });

    document.getElementById('recCount-' + sectionId).textContent = list.length + ' record' + (list.length === 1 ? '' : 's');
    var body = document.getElementById('recBody-' + sectionId);
    var noRes = document.getElementById('noResults-' + sectionId);

    if (!list.length) {
      body.innerHTML = '';
      noRes.style.display = 'block';
      return;
    }
    noRes.style.display = 'none';

    // PERFORMANCE: keep the complete list in memory, but only create a limited
    // number of DOM rows. Huge Activity Logs/tables should never block scrolling.
    state.currentList = list;
    var pageSize = sectionId === 'activity_logs' ? 120 : 180;
    var visibleCount = Math.min(pageSize, list.length);
    var visible = list.slice(0, visibleCount);

    body.innerHTML = visible.map(function (r, i) {
      var m = metaFor(r.status);
      var cells = s.tableCols.map(function (c) { return '<td>' + (esc(r[c.key]) || '—') + '</td>'; }).join('');
      var statusCell = s.hideStatusColumn ? '' : ('<td><span class="badge" style="' + badgeStyle(r.status) + '">' + m.icon + ' ' + esc(r.status) + '</span></td>');
      return '<tr onclick="showDetail(\'' + sectionId + '\',' + i + ')">' +
        '<td class="code">' + (esc(getDisplayAssetCode(s, r)) || '—') + '</td>' +
        statusCell + cells + '</tr>';
    }).join('');

    var pagerId = 'tablePager-' + sectionId;
    var existingPager = document.getElementById(pagerId);
    if (existingPager) existingPager.remove();
    if (list.length > visibleCount) {
      var pager = document.createElement('div');
      pager.id = pagerId;
      pager.style.cssText = 'display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 0;font-size:11px;color:#596579;';
      pager.innerHTML = '<span>Showing ' + visibleCount + ' of ' + list.length + ' records</span>' +
        '<button type="button" style="border:0;border-radius:8px;padding:7px 11px;background:#EEF1F6;color:#33445F;font-weight:700;cursor:pointer;" onclick="showMoreRows_(\'' + sectionId + '\')">Show more</button>';
      body.parentElement.parentElement.parentElement.appendChild(pager);
    }
  }

  function showMoreRows_(sectionId) {
    var state = SECTION_STATE[sectionId];
    if (!state || !state.currentList) return;
    var s = activeWorkspace.sections.filter(function(x){return x.id===sectionId;})[0];
    if (!s) return;
    var body = document.getElementById('recBody-' + sectionId);
    if (!body) return;
    var current = body.rows.length;
    var pageSize = sectionId === 'activity_logs' ? 120 : 180;
    var next = Math.min(current + pageSize, state.currentList.length);
    var html = '';
    for (var i=current; i<next; i++) {
      var r=state.currentList[i], m=metaFor(r.status);
      var cells=s.tableCols.map(function(c){return '<td>'+(esc(r[c.key])||'—')+'</td>';}).join('');
      var statusCell=s.hideStatusColumn?'':('<td><span class="badge" style="'+badgeStyle(r.status)+'">'+m.icon+' '+esc(r.status)+'</span></td>');
      html+='<tr onclick="showDetail(\''+sectionId+'\','+i+')"><td class="code">'+(esc(getDisplayAssetCode(s,r))||'—')+'</td>'+statusCell+cells+'</tr>';
    }
    body.insertAdjacentHTML('beforeend',html);
    var pager=document.getElementById('tablePager-'+sectionId);
    if(pager){
      if(next>=state.currentList.length){pager.remove();}
      else pager.querySelector('span').textContent='Showing '+next+' of '+state.currentList.length+' records';
    }
  }

  function showDetail(sectionId, idx) {
    var s = activeWorkspace.sections.filter(function (x) { return x.id === sectionId; })[0];
    var r = SECTION_STATE[sectionId].currentList[idx];
    renderRecordDetail(s, r);
  }

  function renderRecordDetail(s, r) {
    var m = metaFor(r.status);

    var rowsHtml = s.detailFields.map(function (f) {
      return '<div class="detail-row"><span class="k">' + esc(f.label) + '</span><span class="v">' + (esc(r[f.key]) || '—') + '</span></div>';
    }).join('');

    /* Primary column value shown in the row/modal (MAC address for
       mac_client / mac_firewall, resolved Asset Code for mac_office,
       r.code for every other section — see getDisplayAssetCode). */
    var codeDisplay = getDisplayAssetCode(s, r);
    var primaryLabel = s.primaryLabel || 'Asset Code';
    var assetCodeRow = codeDisplay
      ? '<div class="detail-row"><span class="k">' + esc(primaryLabel) + '</span><span class="v">' + esc(codeDisplay) + '</span></div>'
      : '';

    /* Modal heading: uses s.titleKey (e.g. Employee Name for
       mac_client / mac_firewall) when available, otherwise falls
       back to r.code. */
    var titleText = (s.titleKey && r[s.titleKey]) ? r[s.titleKey] : r.code;

    var badgeInner = (s.hideStatusColumn ? '' : ('<span class="badge" style="' + badgeStyle(r.status) + '">' + m.icon + ' ' + esc(r.status) + '</span> ')) +
      '<span class="source-badge ' + s.id + '" style="margin-left:6px;">' + esc(s.icon) + ' ' + esc(s.title) + '</span>';

    var overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.onclick = function (e) { if (e.target === overlay) closeModal(); };
    overlay.innerHTML =
      '<div class="modal">' +
      '<div class="modal-head"><h4>' + esc(titleText) + '</h4><button class="modal-close" onclick="closeModal()">✕</button></div>' +
      '<div class="modal-badge">' + badgeInner + '</div>' +
      assetCodeRow +
      rowsHtml +
      (codeDisplay ? '<div class="asset-timeline-wrap">' +
        '<div class="asset-timeline-head">' +
          '<div><div class="asset-timeline-title">🕘 Asset Timeline</div><div class="asset-timeline-sub">Complete activity history for this asset</div></div>' +
          '<button type="button" class="timeline-btn" onclick="loadAssetTimeline_(\'' + esc(codeDisplay).replace(/'/g, "\\'") + '\')">View Timeline</button>' +
        '</div>' +
        '<div id="assetTimelineBody" class="asset-timeline-empty timeline-empty">Click <b>View Timeline</b> to see the asset history.</div>' +
      '</div>' : '') +
      '</div>';
    document.body.appendChild(overlay);
  }

  /* ============================================================
   * GLOBAL SEARCH — searches Employee ID / Employee Name / MAC
   * Address across ALL sheets (Office + Client + Other + Mobile +
   * Studio + Courier + Material IN + MAC tabs) and shows a unified
   * result list, regardless of which tab is currently active.
   * Studio Items has no Employee ID/Name, so it's matched on Item
   * Name / Checked By / Serial / Model / Location instead. Courier
   * Data has no Employee ID, so it's matched on Employee Name /
   * Client Name / Courier Name / Consignment No instead. Material
   * IN has no Employee ID either, so it's matched on Item / Material
   * Description / From / Checked By / Location instead. The MAC
   * tabs (mac_office / mac_client / mac_firewall) are additionally
   * matched on MAC Address / Other MAC / resolved Asset Code.
   * ============================================================ */
  function getRecordEmpName(sectionId, r) {
    if (sectionId === 'client') return r.userName || '';
    if (sectionId === 'studio') return r.checkedBy || '';
    if (sectionId === 'courier') return r.empName || '';
    if (sectionId === 'materialin') return r.checkedBy || '';
    return r.empName || '';
  }

  function getRecordSubtitle(sectionId, r) {
    if (sectionId === 'client') {
      var bits = [];
      if (r.clientName) bits.push(r.clientName);
      if (r.cyntexaLoc) bits.push(r.cyntexaLoc);
      if (r.makeModel) bits.push(r.makeModel);
      return bits.join(' · ');
    }
    if (sectionId === 'other') {
      var bits3 = [];
      if (r.category) bits3.push(r.category);
      if (r.location) bits3.push(r.location);
      if (r.remarks) bits3.push(r.remarks);
      return bits3.join(' · ');
    }
    if (sectionId === 'mobile') {
      var bits4 = [];
      if (r.category) bits4.push(r.category);
      if (r.configuration) bits4.push(r.configuration);
      if (r.remarks) bits4.push(r.remarks);
      return bits4.join(' · ');
    }
    if (sectionId === 'studio') {
      var bits5 = [];
      if (r.category) bits5.push(r.category);
      if (r.location) bits5.push(r.location);
      if (r.qty) bits5.push('Qty: ' + r.qty);
      if (r.remarks) bits5.push(r.remarks);
      return bits5.join(' · ');
    }
    if (sectionId === 'courier') {
      var bits6 = [];
      if (r.clientName) bits6.push(r.clientName);
      if (r.courierName) bits6.push(r.courierName);
      if (r.consignmentNo) bits6.push('Consgn: ' + r.consignmentNo);
      if (r.dispatchDate) bits6.push('Dispatched ' + r.dispatchDate);
      return bits6.join(' · ');
    }
    if (sectionId === 'materialin') {
      var bits7 = [];
      if (r.category) bits7.push(r.category);
      if (r.fromVendor) bits7.push('From: ' + r.fromVendor);
      if (r.qty) bits7.push('Qty: ' + r.qty);
      if (r.date) bits7.push('Received ' + r.date);
      return bits7.join(' · ');
    }
    if (sectionId === 'mac_office') {
      var bits8 = [];
      if (r.location) bits8.push(r.location);
      if (r.otherMac) bits8.push('Other: ' + r.otherMac);
      if (r.remarks) bits8.push(r.remarks);
      return bits8.join(' · ');
    }
    if (sectionId === 'mac_client') {
      var bits9 = [];
      if (r.clientName) bits9.push(r.clientName);
      if (r.otherMac) bits9.push('Other: ' + r.otherMac);
      if (r.remarks) bits9.push(r.remarks);
      return bits9.join(' · ');
    }
    if (sectionId === 'mac_firewall') {
      var bits10 = [];
      if (r.macAddress) bits10.push(r.macAddress);
      if (r.remarks) bits10.push(r.remarks);
      return bits10.join(' · ');
    }
    if (sectionId === 'laptops') {
      var bits11 = [];
      if (r.assetType) bits11.push(r.assetType);
      if (r.serialNumber) bits11.push('SN: ' + r.serialNumber);
      if (r.purchasedFrom) bits11.push(r.purchasedFrom);
      return bits11.join(' · ');
    }
    var bits2 = [];
    if (r.date) bits2.push('Assigned ' + r.date);
    if (r.remarks) bits2.push(r.remarks);
    return bits2.join(' · ');
  }

  function getRecordExtraHaystack(sectionId, r) {
    // Every record value is searchable: serial/IMEI/MAC/model/client/remarks etc.
    return Object.keys(r || {}).map(function (key) {
      var value = r[key];
      if (value === null || value === undefined) return '';
      return typeof value === 'object' ? JSON.stringify(value) : String(value);
    }).join(' ');
  }

  function onGlobalSearch() {
    if (globalSearchTimer) clearTimeout(globalSearchTimer);
    globalSearchTimer = setTimeout(runGlobalSearch, 80);
  }

  function runGlobalSearch() {
    var input = document.getElementById('globalSearchInput');
    var q = input.value.trim().toUpperCase();
    var clearBtn = document.getElementById('globalClearBtn');
    var resultsBox = document.getElementById('globalResults');
    clearBtn.style.display = q ? 'inline-block' : 'none';

    if (!q) {
      resultsBox.style.display = 'none';
      resultsBox.innerHTML = '';
      return;
    }

    // Global Search must search every non-admin section across all workspaces,
    // not only the currently open workspace.
    var SECTIONS_LOCAL = [];
    WORKSPACES.forEach(function (w) {
      w.sections.forEach(function (s) {
        if (!s.adminOnly || CURRENT_USER_IS_ADMIN) SECTIONS_LOCAL.push(s);
      });
    });

    var notReady = SECTIONS_LOCAL.filter(function (s) { return !SECTION_STATE[s.id] || !SECTION_STATE[s.id].data; });
    if (notReady.length) {
      // Use data that is already loaded instead of blocking the search because
      // another section is still warming in the background.
      SECTIONS_LOCAL = SECTIONS_LOCAL.filter(function (s) {
        return SECTION_STATE[s.id] && SECTION_STATE[s.id].data && !SECTION_STATE[s.id].data.error;
      });
    }

    var matches = [];
    SECTIONS_LOCAL.forEach(function (s) {
      var recs = SECTION_STATE[s.id].data.records || [];
      recs.forEach(function (r, ri) {
        var empId = String(r.empId || '');
        var empName = getRecordEmpName(s.id, r);
        var extra = getRecordExtraHaystack(s.id, r);
        var haystack = SECTION_STATE[s.id].data._search ? SECTION_STATE[s.id].data._search[ri] : (empId + ' ' + empName + ' ' + r.code + ' ' + extra).toUpperCase();
        if (haystack.indexOf(q) > -1) {
          matches.push({ section: s, record: r });
        }
      });
    });

    if (!matches.length) {
      resultsBox.style.display = 'block';
      resultsBox.innerHTML = '<div class="gresult-empty">No matching records in either sheet for "' + esc(input.value.trim()) + '".</div>';
      GLOBAL_MATCHES = [];
      return;
    }

    GLOBAL_MATCHES = matches;
    resultsBox.style.display = 'block';
    resultsBox.innerHTML = matches.map(function (item, i) {
      var s = item.section, r = item.record;
      var m = metaFor(r.status);
      var sub = getRecordSubtitle(s.id, r);
      var titleHtml;
      if (s.id === 'studio') {
        titleHtml = esc(r.name || '—') +
          (r.checkedBy ? ' <span style="color:var(--slate);font-weight:500;">(Checked by: ' + esc(r.checkedBy) + ')</span>' : '') +
          ' — <span class="code">' + esc(r.code) + '</span>';
      } else if (s.id === 'courier') {
        var cname = getRecordEmpName(s.id, r) || '—';
        titleHtml = esc(cname) +
          (r.clientName ? ' <span style="color:var(--slate);font-weight:500;">(' + esc(r.clientName) + ')</span>' : '') +
          ' — <span class="code">' + esc(r.code) + '</span>';
      } else if (s.id === 'materialin') {
        titleHtml = esc(r.item || '—') +
          (r.checkedBy ? ' <span style="color:var(--slate);font-weight:500;">(Checked by: ' + esc(r.checkedBy) + ')</span>' : '') +
          ' — <span class="code">' + esc(r.code) + '</span>';
      } else {
        var name = getRecordEmpName(s.id, r) || '—';
        var empId = r.empId || '—';
        titleHtml = esc(name) + ' <span style="color:var(--slate);font-weight:500;">(ID: ' + esc(empId) + ')</span> — <span class="code">' + esc(r.code) + '</span>';
      }
      return '<div class="gresult-row" onclick="openGlobalDetail(' + i + ')">' +
        '<span class="source-badge ' + s.id + '">' + s.icon + ' ' + esc(s.title) + '</span>' +
        '<div class="gresult-main">' +
        '<span class="gresult-title">' + titleHtml + '</span>' +
        '<span class="gresult-sub">' + (esc(sub) || '&nbsp;') + '</span>' +
        '</div>' +
        '<span class="badge" style="' + badgeStyle(r.status) + '">' + m.icon + ' ' + esc(r.status) + '</span>' +
        '</div>';
    }).join('') + '<div class="gresult-count-pill" style="margin:8px 14px;display:inline-block;">' + matches.length + ' match' + (matches.length === 1 ? '' : 'es') + ' across ' + (new Set(matches.map(function (x) { return x.section.id; }))).size + ' sheet(s)</div>';
  }

  var GLOBAL_MATCHES = [];
  function openGlobalDetail(i) {
    var item = GLOBAL_MATCHES[i];
    if (!item) return;
    renderRecordDetail(item.section, item.record);
  }

          ' — <span class="code">' + esc(r.code) + '</span>';
      } else if (item.sectionId === 'materialin') {
        titleHtml = esc(r.item || '—') +
          (r.checkedBy ? ' <span style="color:var(--slate);font-weight:500;">(Checked by: ' + esc(r.checkedBy) + ')</span>' : '') +
          ' — <span class="code">' + esc(r.code) + '</span>';

      return '<div class="gresult-row" onclick="openHomeGlobalDetail(' + i + ')">' +

  /* ============================================================
   * ASSET TIMELINE
   * Loads only the selected asset's history from the shared Activity_Log.
   * Existing tables, searches, refreshes and edit flows remain unchanged.
   * ============================================================ */
  function timelineMeta_(record) {
    var action=String(record.action||'').toUpperCase();
    var field=String(record.field||'').toUpperCase();
    if(action.indexOf('CREATED')>-1 || action==='RECORD CREATED') return {icon:'🟢',title:'Asset Created'};
    if(action.indexOf('ASSIGNED')>-1 || action.indexOf('ASSIGNMENT')>-1) return {icon:'👤',title:'Assignment Updated'};
    if(field.indexOf('MAC')>-1 || action.indexOf('MAC')>-1) return {icon:'📶',title:'MAC Address Updated'};
    if(field.indexOf('TRANSFER')>-1 || action.indexOf('TRANSFER')>-1) return {icon:'🔄',title:'Asset Transferred'};
    if(action.indexOf('SUBMITTED')>-1) return {icon:'📥',title:'Asset Submitted'};
    if(action.indexOf('DETAILS')>-1 || action.indexOf('UPDATED')>-1 || action==='UPDATE' || action==='BULK UPDATED') return {icon:'📝',title:'Asset Details Updated'};
    return {icon:'📌',title:record.action||'Activity Updated'};
  }

  function loadAssetTimeline_(assetCode) {
    var box=document.getElementById('assetTimelineBody');
    if(!box) return;
    box.className='timeline-loading';
    box.textContent='Loading asset history…';
    google.script.run
      .withSuccessHandler(function(result){
        if(!result || !result.ok){
          box.className='timeline-error';
          box.textContent=(result && result.error) || 'Could not load asset timeline.';
          return;
        }
        var records=result.records||[];
        if(!records.length){
          box.className='timeline-empty';
          box.textContent='No activity history found for this asset.';
          return;
        }
        box.className='asset-timeline';
        box.innerHTML=records.map(function(r){
          var meta=timelineMeta_(r);
          var oldV=String(r.oldValue||'').trim();
          var newV=String(r.newValue||'').trim();
          var change='';
          if(oldV && oldV!=='No previous value' && oldV!=='New record') change += '<div class="timeline-old"><b>Before:</b> '+esc(oldV)+'</div>';
          if(newV) change += '<div class="timeline-new"><b>After:</b> '+esc(newV)+'</div>';
          return '<div class="timeline-item">' +
            '<div class="timeline-dot">'+meta.icon+'</div>' +
            '<div class="timeline-card">' +
              '<div class="timeline-top"><span class="timeline-action">'+esc(meta.title)+'</span><span class="timeline-time">'+esc(r.timestamp)+'</span></div>' +
              '<div class="timeline-meta">'+esc(r.workspace)+' · '+esc(r.tab)+(r.user?' · By '+esc(r.user):'')+'</div>' +
              (r.field && !/^Process \(/i.test(String(r.field)) ? '<div class="timeline-meta"><b>Field:</b> '+esc(r.field)+'</div>' : '') +
              (change ? '<div class="timeline-change">'+change+'</div>' : '') +
            '</div></div>';
        }).join('');
      })
      .withFailureHandler(function(error){
        box.className='timeline-error';
        box.textContent=(error && error.message) || 'Could not load asset timeline.';
      })
      .getAssetTimeline(assetCode);
  }

  function closeModal() {
    var o = document.querySelector('.overlay');
    if (o) o.remove();
  }

  
  /* ============================================================
   * ACTIVITY LOG REAL-TIME SYNC
   * Activity Logs are independent from the normal 30s dashboard
   * refresh. Every open dashboard checks the shared Activity_Log
   * every 2 seconds. It only downloads the full log when the
   * server reports that a new row/timestamp exists.
   * ============================================================ */
  var activityLogRealtimeIntervalId = null;
  var activityLogRealtimeBusy = false;
  var activityLogVersion = { lastRow: 0, lastTimestampMs: 0 };

  function startActivityLogRealtimeSync_() {
    if (activityLogRealtimeIntervalId) clearInterval(activityLogRealtimeIntervalId);
    activityLogRealtimeIntervalId = setInterval(checkActivityLogRealtime_, 15000);
    checkActivityLogRealtime_();

  function checkActivityLogRealtime_() {
    // Do not spend Apps Script/network time checking logs while another tab is open.
    if (!activeWorkspace || activeSection !== 'activity_logs') return;
    if (activityLogRealtimeBusy) return;
    activityLogRealtimeBusy = true;

    google.script.run
      .withSuccessHandler(function (version) {
        if (!version) {
          activityLogRealtimeBusy = false;
          return;
        }

        var changed =
          Number(version.lastRow || 0) !== Number(activityLogVersion.lastRow || 0) ||
          Number(version.lastTimestampMs || 0) !== Number(activityLogVersion.lastTimestampMs || 0);

        if (!changed) {
          activityLogRealtimeBusy = false;
          return;
        }

        google.script.run
          .withSuccessHandler(function (data) {
            activityLogRealtimeBusy = false;
            if (!data || data.error) return;

            SHEET_DATA.activity_logs = data;
            activityLogVersion = version;

            if (SECTION_STATE.activity_logs) {
              SECTION_STATE.activity_logs.data = data;
            }

            // Only repaint when the Activity Logs section is currently open.
            if (activeSection === 'activity_logs') {
              var section = activeWorkspace && activeWorkspace.sections ?
                activeWorkspace.sections.filter(function (x) { return x.id === 'activity_logs'; })[0] : null;

              if (section) {
                onSectionData(section, data);
              }
            }
          })
          .withFailureHandler(function () {
            activityLogRealtimeBusy = false;
          })
          .getActivityLog({});
      })
      .withFailureHandler(function () {
        activityLogRealtimeBusy = false;
      })
      .getActivityLogVersion();
  }

  function stopActivityLogRealtimeSync_() {

/* ============================================================
   * AUTO-REFRESH — every 59 seconds, silently re-pull data for
   * every section of the OPEN workspace, update counts/charts/
   * tables in place, and show a small toast + flash animation so
   * it feels alive.
   * ------------------------------------------------------------
   * FIX: since openWorkspace() now always rebuilds and calls
   * startAutoRefresh() again, we track the running interval id
   * and clear any previous one first — otherwise switching
   * between workspaces would stack up multiple refresh timers.
   * ============================================================ */
  var autoRefreshIntervalId = null;
  function startAutoRefresh() {
    if (autoRefreshIntervalId) clearInterval(autoRefreshIntervalId);
    refreshCountdown = AUTO_REFRESH_SECONDS;
    updateRefreshUI();
    autoRefreshIntervalId = setInterval(function () {
      if (!activeWorkspace) return;
      refreshCountdown--;
      if (refreshCountdown <= 0) {
        refreshCountdown = AUTO_REFRESH_SECONDS;
        refreshAllSections();
      }
      updateRefreshUI();
    }, 1000);
  }

  function updateRefreshUI() {
    var label = document.getElementById('refreshLabel');
    var ring = document.getElementById('ringFg');
    if (!label || !ring) return;
    label.textContent = 'Refreshing in ' + refreshCountdown + 's';
    var fraction = refreshCountdown / AUTO_REFRESH_SECONDS;
    ring.setAttribute('stroke-dashoffset', String(RING_CIRCUMFERENCE * (1 - fraction)));
  }

  function manualRefresh() {
    refreshCountdown = AUTO_REFRESH_SECONDS;
    refreshAllSections();
  }

  function refreshAllSections() {
    if (!activeWorkspace) return;
    var sections = activeWorkspace.sections.filter(function(s){
      return !s.adminOnly || CURRENT_USER_IS_ADMIN;
    });
    var badge = document.getElementById('refreshBadge');
    var icon = document.getElementById('ringIcon');
    if (badge) badge.classList.add('spinning');
    if (icon) icon.textContent = '⏳';

    // PERFORMANCE: refresh only the active section. Fetching every sheet in
    // parallel/background was the main source of network, parsing and DOM work.
    // Other tabs still load normally when the user opens them.
    var visible = sections.filter(function(s){return s.id === activeSection;})[0];
    if(!visible || SECTION_LOADING[visible.id]) { finishRefreshUI(); return; }

    google.script.run
      .withSuccessHandler(function(data){ silentApplyData(visible, data); finishRefreshUI(); })
      .withFailureHandler(function(){ finishRefreshUI(); })[visible.fetchFn]();
  }

  function finishRefreshUI() {
    var badge = document.getElementById('refreshBadge');
    var icon = document.getElementById('ringIcon');
    if (badge) badge.classList.remove('spinning');
    if (icon) icon.textContent = '🔄';
    showToast('Dashboard refreshed ✓');
  }

  function silentApplyData(s, data) {
    if (data.error || !SECTION_STATE[s.id]) return;
    SHEET_DATA[s.id] = data;
    var oldState = SECTION_STATE[s.id];
    var wasFilter = oldState.currentFilter;
    var wasStatusFilter = oldState.statusFilter;
    var wasOpen = document.getElementById('records-' + s.id) &&
                  document.getElementById('records-' + s.id).style.display === 'block';

    SECTION_STATE[s.id].data = data;
    data._loadedAt = Date.now();
    if (!data._search) data._search = (data.records || []).map(function(r){ return (String(r.empId||'') + " " + getRecordEmpName(s.id,r) + " " + String(r.code||'') + " " + getRecordExtraHaystack(s.id,r)).toUpperCase(); });
    SECTION_STATE[s.id].currentFilter = wasFilter;
    SECTION_STATE[s.id].statusFilter = wasStatusFilter;

    var tabCountEl = document.getElementById('tabcount-' + s.id);
    if (tabCountEl) tabCountEl.textContent = data.total;

    if (s.id === activeSection) {
      document.getElementById('globalUpdated').innerHTML = '<span class="dot"></span>' + s.title + ' updated ' + data.updated;
    }

    // update each stat card value with a flash + count-up animation
    var counts = data.counts;
    var allCard = document.querySelector('#section-' + s.id + ' .card[data-status="__ALL__"] .value');
    if (allCard) {
      animateValue(allCard, data.total, 240);
      allCard.closest('.card').classList.add('just-updated');
      setTimeout(function () { allCard.closest('.card').classList.remove('just-updated'); }, 1200);
    }
    Object.keys(counts).forEach(function (l) {
      var card = document.querySelector('#section-' + s.id + ' .card[data-status="' + CSS.escape(l) + '"]');
      if (card) {
        var valEl = card.querySelector('.value');
        animateValue(valEl, counts[l], 240);
        card.classList.add('just-updated');
        setTimeout(function () { card.classList.remove('just-updated'); }, 1200);
      }
    });

    // Never rebuild large tables/charts for hidden sections. Activity Logs is
    // intentionally left untouched until it is actually the active section.
    if (s.showCharts && s.id === activeSection) renderCharts(s);
    if (wasOpen && s.id === activeSection) renderTable(s.id);

    if (s.statusFilterField) {
      var sfCounts = {};
      (data.records || []).forEach(function (r) {
        var key = String(r[s.statusFilterField] || 'UNKNOWN').trim().toUpperCase();
        sfCounts[key] = (sfCounts[key] || 0) + 1;
      });
      if (s.statusFilterType === 'dropdown') {
        var dropdown = document.getElementById('statusDropdown-' + s.id);
        if (dropdown) {
          var currentVal = dropdown.value;
          var optsHtml = '<option value="__ALL__">All ' + esc(s.statusFilterLabel || 'Items') + ' (' + data.total + ')</option>';
          Object.keys(sfCounts).forEach(function (l) {
            var m = metaFor(l);
            optsHtml += '<option value="' + esc(l) + '">' + m.icon + ' ' + esc(l) + ' (' + sfCounts[l] + ')</option>';
          });
          dropdown.innerHTML = optsHtml;
          dropdown.value = currentVal;
        }
      } else {
        var allChip = document.querySelector('#statusFilter-' + s.id + ' .status-chip[data-sf="__ALL__"] .chip-count');
        if (allChip) allChip.textContent = data.total;
        Object.keys(sfCounts).forEach(function (l) {
          var chip = document.querySelector('#statusFilter-' + s.id + ' .status-chip[data-sf="' + CSS.escape(l) + '"] .chip-count');
          if (chip) chip.textContent = sfCounts[l];
        });
      }
    }

    var gInput = document.getElementById('globalSearchInput');
    if (gInput && gInput.value.trim()) onGlobalSearch();
  }

  function officeAssignmentDateInput_(value) {
    var text = String(value || '').trim();
    var monthMap = { JAN: 0, FEB: 1, MAR: 2, APR: 3, MAY: 4, JUN: 5, JUL: 6, AUG: 7, SEP: 8, OCT: 9, NOV: 10, DEC: 11 };
    var match = text.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
    var date;
    if (match && monthMap.hasOwnProperty(match[2].toUpperCase())) {
      date = new Date(Number(match[3]), monthMap[match[2].toUpperCase()], Number(match[1]));
    } else {
      match = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      date = match ? new Date(Number(match[3]), Number(match[2]) - 1, Number(match[1])) : new Date(text);
    }
    if (!text || isNaN(date.getTime())) return '';
    return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
  }

  function officeAssignmentTodayInput_() {
    var today = new Date();
    return today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
  }

  function handleOfficeAssignmentStatusChange_() {
    var status = document.getElementById('officeAssignStatus');
    var assignDate = document.getElementById('officeAssignDate');
    var remarks = document.getElementById('officeAssignRemarks');
    if (status && assignDate && status.value === 'ASSIGNED') {
      // Every time ASSIGNED is selected, start with today's date. The user can
      // still change it manually before saving if a different date is needed.
      assignDate.value = officeAssignmentTodayInput_();
      if (remarks) remarks.value = 'DONE';
    }
  }

  function officeAssignmentStatusOptions_(currentStatus) {
    var current = String(currentStatus || '').trim().toUpperCase();
    var statuses = OFFICE_LAPTOP_STATUS_OPTIONS_.slice();
    var placeholder = '';
    if (statuses.indexOf(current) === -1) {
      current = '';
      placeholder = '<option value="" disabled selected>Select Asset Status</option>';
    }
    return placeholder + statuses.map(function (status) {
      return '<option value="' + esc(status) + '"' + (status === current ? ' selected' : '') + '>' + esc(status) + '</option>';
    }).join('');
  }

  function getOfficeEmployeeMatches_(query) {
    var macData = SHEET_DATA.mac_office;
    var queryText = String(query || '').trim().toUpperCase();
    if (!queryText || !macData || !Array.isArray(macData.records)) return [];

    var seen = {};
    var matches = [];
    macData.records.forEach(function (record) {
      var empId = String(record.empId || '').trim();
      var empName = String(record.empName || '').trim();
      var key = empId.toUpperCase();
      if (!empId || !empName || seen[key] || (empId.toUpperCase().indexOf(queryText) === -1 && empName.toUpperCase().indexOf(queryText) === -1)) return;
      seen[key] = true;
      matches.push({ empId: empId, empName: empName });
    });
    return matches.slice(0, 8);
  }

  // Make the current view responsive immediately; the full sheet refresh is
  // fetched separately after Apps Script confirms the write.
  function applyOfficeAssignmentResult_(payload, status) {
    var data = SHEET_DATA.office;
    if (!data || !Array.isArray(data.records)) return;

    var record = data.records.find(function (item) {
      return String(item.code || '').trim().toUpperCase() ===
        String(payload.assetCode || '').trim().toUpperCase();
    });
    if (!record) return;

    var oldStatus = String(record.status || 'UNKNOWN').trim().toUpperCase();
    record.empId = payload.empId;
    record.empName = payload.empName;
    record.date = officeAssignmentDisplayDate_(payload.assignDate);
    record.remarks = payload.remarks;
    record.notes = payload.notes;
    record.status = status;

    data.counts = data.counts || {};
    if (oldStatus !== status) {
      data.counts[oldStatus] = Math.max(0, (data.counts[oldStatus] || 1) - 1);
      if (data.counts[oldStatus] === 0) delete data.counts[oldStatus];
      data.counts[status] = (data.counts[status] || 0) + 1;
    }
    data.updated = 'just now';
    data._search = null;

    var officeEntry = SECTION_INDEX.office;
    if (officeEntry && document.getElementById('section-office')) {
      onSectionData(officeEntry.section, data);
    }

    var homeSearch = document.getElementById('homeSearchInput');
    if (homeSearch && homeSearch.value.trim()) onHomeGlobalSearch();
    var globalSearch = document.getElementById('globalSearchInput');
    if (globalSearch && globalSearch.value.trim()) onGlobalSearch();
  }

  // Full data reload runs without blocking the user or the Save button.
  function refreshOfficeDataInBackground_() {
    clearTimeout(OFFICE_ASSIGNMENT_REFRESH_TIMER_);
    OFFICE_ASSIGNMENT_REFRESH_TIMER_ = setTimeout(function () {
      google.script.run
        .withSuccessHandler(function (data) {
          if (!data || data.error) return;
          data._loadedAt = Date.now();
          SHEET_DATA.office = data;
          var officeEntry = SECTION_INDEX.office;
          if (officeEntry && document.getElementById('section-office')) {
            onSectionData(officeEntry.section, data);
          }
        })
        .withFailureHandler(function () {
          // The local view stays usable; normal auto-refresh will retry.
        })
        .getDashboardData();
    }, 150);
  }

  function saveOfficeAssignment_() {
    var record = OFFICE_ASSIGNMENT_RECORD_;
    if (!record) return;

    var payload = {
      assetCode: record.code,
      status: document.getElementById('officeAssignStatus').value,
      empId: document.getElementById('officeAssignEmpId').value.trim(),
      empName: document.getElementById('officeAssignEmpName').value.trim(),
      assignDate: document.getElementById('officeAssignDate').value,
      remarks: document.getElementById('officeAssignRemarks').value.trim(),
      notes: document.getElementById('officeAssignNotes').value.trim()
    };

    // Mirror the server-side status rules before the optimistic UI update.
    if (payload.status === 'NOT ASSIGNED') {
      payload.empId = '';
      payload.empName = '';
      payload.assignDate = '';
      payload.remarks = 'Ready to Assign';
      payload.notes = '';
    } else if (payload.status === 'ASSIGNED') {
      if (!payload.assignDate) payload.assignDate = officeAssignmentTodayInput_();
      payload.remarks = 'DONE';
    }

    var isSubmit = payload.status === 'NOT ASSIGNED';
    var optimisticStatus = payload.status;

    // Close the form and update its displayed record immediately. The sheet
    // write continues through google.script.run in the background.
    applyOfficeAssignmentResult_(payload, optimisticStatus);
    closeModal();
    showToast(isSubmit
      ? 'Submitting ' + payload.assetCode + '…'
      : 'Saving ' + payload.assetCode + '…');

    google.script.run
      .withSuccessHandler(function (result) {
        if (!result || !result.ok) {
          showToast((result && result.message) || 'Could not save the asset. Please try again.');
          refreshOfficeDataInBackground_();
          return;
        }

        // Keep the browser aligned with the server-side status, then refresh
        // all Office_Laptops rows independently in the background.
        applyOfficeAssignmentResult_(payload, result.status);
        showToast(result.submitted
          ? 'Asset ' + result.assetCode + ' submitted ✓'
          : 'Asset ' + result.assetCode + ' assigned ✓');
        refreshOfficeDataInBackground_();
      })
      .withFailureHandler(function (error) {
        showToast('Save failed: ' + ((error && error.message) || 'Please try again.'));
        refreshOfficeDataInBackground_();
      })
      .assignOfficeLaptop(payload);
  }

  function clientLaptopEditDate_(value) {
    var text = String(value || '').trim();
    if (!text) return '';
    var monthMap = { JAN: 0, FEB: 1, MAR: 2, APR: 3, MAY: 4, JUN: 5, JUL: 6, AUG: 7, SEP: 8, OCT: 9, NOV: 10, DEC: 11 };
    var match = text.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
    var date;
    if (match && monthMap.hasOwnProperty(match[2].toUpperCase())) {
      date = new Date(Number(match[3]), monthMap[match[2].toUpperCase()], Number(match[1]));
    } else {
      match = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      date = match ? new Date(Number(match[3]), Number(match[2]) - 1, Number(match[1])) : new Date(text);
    }
    if (!text || isNaN(date.getTime())) return '';
    return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
  }

  function recordDateValues_(record) {
    var output = [];
    Object.keys(record || {}).forEach(function (key) {
      if (key.toLowerCase().indexOf('date') === -1) return;
      var text = String(record[key] || '').trim();
      if (!text) return;
      var d = new Date(text);
      if (isNaN(d.getTime())) {
        var m = text.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
        var months = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};

      if (!isNaN(d.getTime())) output.push({ key: key, text: text, time: new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() });

        if (textOk && dateOk) matches.push({ sectionId: sectionId, record: record, dates: dates.filter(function (item) { return (!from || item.time >= from) && (!to || item.time <= to); }) });

    }).join('') + '</tbody></table></div>';
  }

<script id="v18-performance-controller">
(function(){
  /* Counter updates are direct text writes instead of requestAnimationFrame loops. */
  window.animateValue=function(el,end){if(el)el.textContent=Math.round(Number(end)||0);};
  /* Prevent the old ripple layer from being created on every click. */
  window.__v18Fast=true;
  document.addEventListener('click',function(e){
    var r=e.target&&e.target.closest?e.target.closest('.v6-ripple'):null;
    if(r) r.remove();
  },{passive:true});
})();
</script>

<style id="v19-ultra-performance">
/* V19 ULTRA PERFORMANCE: keep the visual language, remove motion/compositing
   from scroll-heavy surfaces and interaction feedback. */
html,body{scroll-behavior:auto!important;}
*,*::before,*::after{animation-duration:0s!important;animation-iteration-count:1!important;}
.ws-card,.card,.panel,.section-tab,.ws-enter,button,input,select,textarea,
.timeline-card,.asset-timeline-wrap,.global-search-wrap,.header,.ws-header{
  transition:none!important;
  will-change:auto!important;
}
.ws-card:hover,.card:hover,.panel:hover,.section-tab:hover,.ws-enter:hover,
button:hover,.timeline-card:hover,.asset-timeline-wrap:hover{
  transform:none!important;filter:none!important;
}
/* Do not create expensive compositing layers for ordinary dashboard content. */
.ws-card,.card,.panel,.section,.section-tabs,.global-search-wrap,.header,.ws-header,
.asset-timeline-wrap,.timeline-card{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;}
/* Activity Logs stays completely inert on pointer movement. */
#section-activity_logs,#section-activity_logs *{animation:none!important;transition:none!important;filter:none!important;}
#section-activity_logs .panel:hover,#section-activity_logs .records-section:hover,
#section-activity_logs .tbl-wrap:hover,#section-activity_logs tr:hover,
#section-activity_logs td:hover{transform:none!important;box-shadow:none!important;background:inherit!important;}
</style>
<script id="v19-ultra-performance-controller">
(function(){
  window.__v19UltraPerformance=true;
  /* Kill legacy ripple/reveal handlers before they can create extra DOM/animation work. */
  function stripEffects(){
    document.querySelectorAll('.v6-ripple').forEach(function(n){n.remove();});
    document.querySelectorAll('.v7-visible').forEach(function(n){n.style.animation='none';});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',stripEffects,{once:true});
  else stripEffects();
  /* Prevent the old anchor smooth-scroll wrapper from turning normal navigation into animated scrolling. */
  document.addEventListener('click',function(e){
    var a=e.target&&e.target.closest?e.target.closest('a[href^="#"]'):null;
    if(!a)return;
    var t=document.querySelector(a.getAttribute('href'));
    if(t){e.preventDefault();t.scrollIntoView({behavior:'auto',block:'start'});}
  },true);
})();
</script>

<style id="v16-native-smooth-scroll">
/* V16 — native smooth scrolling: never block wheel/touchpad input. */
html{scroll-behavior:smooth;scroll-padding-top:18px;overscroll-behavior-y:auto!important;}
body{scroll-behavior:smooth;overscroll-behavior-y:auto!important;-webkit-overflow-scrolling:touch;}

/* Records are part of the page flow. There is NO nested vertical scroller.
   This is important for mouse-wheel and precision-touchpad scrolling. */
.records-section{overflow:visible!important;}
.records-section .tbl-wrap{
  overflow-x:auto!important;
  overflow-y:visible!important;
  max-height:none!important;
  height:auto!important;
  overscroll-behavior:auto!important;
  -webkit-overflow-scrolling:touch;
}

/* Activity Logs uses the document as its only vertical scroll surface.
   Do not virtualize rows here: dynamic row sizing can make touchpad scroll
   feel sticky/jumpy when content-visibility is combined with tables. */
#section-activity_logs .tbl-wrap{
  overflow-x:auto!important;
  overflow-y:visible!important;
  max-height:none!important;
  height:auto!important;
  overscroll-behavior:auto!important;
  -webkit-overflow-scrolling:touch;
}
#section-activity_logs table{
  width:max-content;
  min-width:100%;
}
#section-activity_logs tbody tr{
  content-visibility:visible!important;
  contain:none!important;
  contain-intrinsic-size:auto!important;
}

/* Other tables: keep the simple page-flow model as well. */
.records-section tbody tr{
  content-visibility:visible!important;
  contain:none!important;
}

/* Keep Activity Logs visually inert while still allowing completely normal
   wheel/touchpad/touch scrolling. */
#section-activity_logs,
#section-activity_logs *{
  scroll-behavior:auto!important;
}
#section-activity_logs .panel:hover,
#section-activity_logs .records-section:hover,
#section-activity_logs .tbl-wrap:hover,
#section-activity_logs table:hover,
#section-activity_logs tbody:hover,
#section-activity_logs tr:hover,
#section-activity_logs td:hover{
  transform:none!important;
  filter:none!important;
}

/* Do not pause transitions from a scroll listener. The browser compositor
   handles native scrolling; no JS scroll animation is needed. */
html.is-scrolling .ws-card,
html.is-scrolling .card,
html.is-scrolling .panel,
html.is-scrolling .asset-timeline-wrap,
html.is-scrolling .ai-assistant-card,
html.is-scrolling .ws-enter,
html.is-scrolling .section-tab{
  transition:none!important;
}

/* Only deliberate UI jumps use smooth behavior; ordinary wheel/touchpad
   input remains native and uninterrupted. */
@media (prefers-reduced-motion:reduce){
  html,body{scroll-behavior:auto!important;}
}

  /* ============================================================

  .header,.ws-header,.global-search-wrap,.card,.panel,.ws-card,.section-tab{animation:none !important;}

</style>
