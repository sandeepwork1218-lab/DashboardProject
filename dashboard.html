        refreshClientDataInBackground_();
      })
      .withFailureHandler(function (error) {
        button.disabled = false;
        button.textContent = 'Save Status';
        showClientLaptopError_('clientLaptopStatusError', (error && error.message) || 'Could not save the client status.');
      })
      .updateClientLaptopStatus({ assetCode: record.code, clientStatus: status });
  }

  // ============================================================
  // COURIER DATA — add / edit all fields, including Drive attachment URL.
  // ============================================================
  var COURIER_RECORD_ = null;
  function courierDateInput_(value) { return clientLaptopEditDate_(value); }
  function courierField_(label, id, value, type, wide) {
    return '<div style="' + (wide ? 'grid-column:1 / -1;' : '') + '"><label style="display:block;margin:0 0 5px;font-size:12px;font-weight:700;color:#33445F;">' + esc(label) + '</label><input id="' + id + '" type="' + (type || 'text') + '" value="' + esc(value || '') + '" style="box-sizing:border-box;width:100%;margin:0 0 13px;padding:10px;border:1px solid #D9E0EA;border-radius:8px;font:inherit;"></div>';
  }
  function courierForm_(prefix, r) {
    r = r || {};
    return courierField_('Client Asset Code', prefix + 'CourierAssetCode', r.assetCode || (r.code === r.consignmentNo ? '' : r.code) || '') + courierField_('Employee Name', prefix + 'CourierEmpName', r.empName || '') +
      courierField_('Client Name', prefix + 'CourierClientName', r.clientName || '') + courierField_('Client Address', prefix + 'CourierClientAddress', r.clientAddress || '', 'text', true) +
      courierField_('Dispatch Date', prefix + 'CourierDispatchDate', courierDateInput_(r.dispatchDate), 'date') + courierField_('Courier Name', prefix + 'CourierName', r.courierName || '') +
      courierField_('Consignment No.', prefix + 'CourierConsignment', r.consignmentNo || '') + courierField_('Weight (Kg)', prefix + 'CourierWeight', r.weightKg || '', 'number') +
      courierField_('Total Amount (Rs)', prefix + 'CourierAmount', r.totalAmount || '', 'number') + courierField_('Item Sent', prefix + 'CourierItem', r.itemSent || '') +
      courierField_('Attachment Drive URL', prefix + 'CourierAttachment', r.attachment || '', 'url', true) +
      '<div><label style="display:block;margin:0 0 5px;font-size:12px;font-weight:700;color:#33445F;">Final Status</label><select id="' + prefix + 'CourierStatus" style="box-sizing:border-box;width:100%;margin:0 0 13px;padding:10px;border:1px solid #D9E0EA;border-radius:8px;background:#fff;font:inherit;">' + ['Pending','In Transit','Delivered','Returned'].map(function (v) { return '<option' + (String(r.finalStatusRaw || '').toLowerCase() === v.toLowerCase() ? ' selected' : '') + '>' + v + '</option>'; }).join('') + '</select></div>' +
      '<div style="grid-column:1 / -1;"><label style="display:block;margin:0 0 5px;font-size:12px;font-weight:700;color:#33445F;">Remarks</label><textarea id="' + prefix + 'CourierRemarks" rows="3" style="box-sizing:border-box;width:100%;margin:0 0 13px;padding:10px;border:1px solid #D9E0EA;border-radius:8px;font:inherit;resize:vertical;">' + esc(r.remarks || '') + '</textarea></div>';
  }
  function courierPayloadFromForm_(prefix, record) { var v = function (id) { var el = document.getElementById(prefix + id); return el ? el.value.trim() : ''; }; return { rowNumber: record && record.rowNumber, assetCode: v('CourierAssetCode'), empName: v('CourierEmpName'), clientName: v('CourierClientName'), clientAddress: v('CourierClientAddress'), dispatchDate: v('CourierDispatchDate'), courierName: v('CourierName'), consignmentNo: v('CourierConsignment'), weightKg: v('CourierWeight'), totalAmount: v('CourierAmount'), itemSent: v('CourierItem'), attachment: v('CourierAttachment'), finalStatus: v('CourierStatus'), remarks: v('CourierRemarks') }; }
  function openCourierModal_(isEdit) {
    var record = isEdit ? COURIER_RECORD_ : null; if (isEdit && !record) return;
    if (isEdit) closeModal();
    var overlay = document.createElement('div'); overlay.className = 'overlay'; overlay.onclick = function (e) { if (e.target === overlay) closeModal(); };
    var prefix = isEdit ? 'edit' : 'new', saveId = prefix + 'CourierSave';
    overlay.innerHTML = '<div class="modal" style="width:720px;max-width:94vw;max-height:calc(100vh - 32px);overflow-y:auto;"><div class="modal-head"><h4>' + (isEdit ? 'Edit Courier Record' : 'Add Courier Record') + '</h4><button class="modal-close" type="button" onclick="closeModal()">✕</button></div><div style="padding:10px 12px;margin-bottom:15px;border-radius:8px;background:#EEF7FF;color:#245B88;font-size:13px;">All Courier_Data fields are editable. Paste the Google Drive attachment link exactly as it is; “Open attachment” will use that link.</div><form onsubmit="saveCourier_(' + (isEdit ? 'true' : 'false') + ');return false;"><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:12px;">' + courierForm_(prefix, record) + '</div><div id="' + prefix + 'CourierError" style="display:none;margin:8px 0;color:#B42318;font-size:12px;"></div><div style="display:flex;justify-content:flex-end;gap:8px;"><button type="button" class="close-records" onclick="closeModal()">Cancel</button><button id="' + saveId + '" type="submit" style="cursor:pointer;border:0;border-radius:8px;background:#347DBE;color:#fff;font-weight:700;padding:9px 14px;">' + (isEdit ? 'Save Changes' : 'Add Courier Record') + '</button></div></form></div>';
    document.body.appendChild(overlay);
  }
  function openAddCourier_(){openCourierModal_(false);} function openEditCourier_(){openCourierModal_(true);}
  function saveCourier_(isEdit) { var prefix = isEdit ? 'edit' : 'new', payload = courierPayloadFromForm_(prefix, isEdit ? COURIER_RECORD_ : null), button = document.getElementById(prefix + 'CourierSave'), error = document.getElementById(prefix + 'CourierError'); if (!payload.assetCode && !payload.consignmentNo && !payload.empName) { error.textContent = 'Enter Client Asset Code, Consignment No. or Employee Name.'; error.style.display = 'block'; return; } button.disabled = true; button.textContent = 'Saving…'; google.script.run.withSuccessHandler(function (result) { if (!result || !result.ok) { button.disabled = false; button.textContent = isEdit ? 'Save Changes' : 'Add Courier Record'; error.textContent = (result && result.message) || 'Could not save courier record.'; error.style.display = 'block'; return; } closeModal(); showToast('Courier record saved ✓'); refreshCourierData_(); }).withFailureHandler(function (e) { button.disabled = false; button.textContent = isEdit ? 'Save Changes' : 'Add Courier Record'; error.textContent = (e && e.message) || 'Could not save courier record.'; error.style.display = 'block'; })[isEdit ? 'updateCourierData' : 'addCourierData'](payload); }
  function refreshCourierData_(){google.script.run.withSuccessHandler(function(data){if(!data||data.error)return;data._loadedAt=Date.now();SHEET_DATA.courier=data;var entry=SECTION_INDEX.courier;if(entry&&document.getElementById('section-courier'))onSectionData(entry.section,data);}).withFailureHandler(function(){}).getCourierData();}

  // MAC workbook record forms (All Devices / Client Laptop / Firewall).
  var MAC_RECORD_ = null;
  function macLabel_(k){return {empId:'Employee ID',empName:'Employee Name',assetType:'Asset Type',macAddress:'MAC Address',otherMac:'Other / MAC Address 2',location:'Location',clientName:'Client Name',remarks:'Remarks'}[k]||k;}
  function macFields_(sectionId){return sectionId==='mac_office'?['empId','empName','assetType','macAddress','otherMac','location','remarks']:sectionId==='mac_client'?['empId','empName','macAddress','otherMac','clientName','remarks']:['empId','empName','macAddress','remarks'];}
  function macForm_(sectionId,r){r=r||{};return macFields_(sectionId).map(function(k){if(k==='remarks')return '<div style="grid-column:1 / -1;"><label style="display:block;margin:0 0 5px;font-size:12px;font-weight:700;color:#33445F;">Remarks</label><textarea id="mac-'+k+'" rows="3" style="box-sizing:border-box;width:100%;padding:10px;border:1px solid #D9E0EA;border-radius:8px;font:inherit;resize:vertical;">'+esc(r[k]||'')+'</textarea></div>';return '<div><label style="display:block;margin:0 0 5px;font-size:12px;font-weight:700;color:#33445F;">'+esc(macLabel_(k))+'</label><input id="mac-'+k+'" value="'+esc(r[k]||'')+'" autocomplete="off" style="box-sizing:border-box;width:100%;margin:0 0 13px;padding:10px;border:1px solid #D9E0EA;border-radius:8px;font:inherit;"></div>';}).join('');}
  function openMacModal_(sectionId,record){if(record)closeModal();var o=document.createElement('div');o.className='overlay';o.onclick=function(e){if(e.target===o)closeModal();};o.innerHTML='<div class="modal" style="width:680px;max-width:94vw;max-height:calc(100vh - 32px);overflow-y:auto;"><div class="modal-head"><h4>'+(record?'Edit':'Add')+' MAC Record</h4><button class="modal-close" type="button" onclick="closeModal()">✕</button></div><div style="padding:10px 12px;margin-bottom:15px;border-radius:8px;background:#EEF7FF;color:#245B88;font-size:13px;">This writes directly to the selected MAC Address workbook tab.</div><form onsubmit="saveMacRecord_();return false;"><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:12px;">'+macForm_(sectionId,record||{})+'</div><div id="macRecordError" style="display:none;color:#B42318;font-size:12px;margin:8px 0;"></div><div style="display:flex;justify-content:flex-end;gap:8px;"><button type="button" class="close-records" onclick="closeModal()">Cancel</button><button id="macRecordSave" type="submit" style="cursor:pointer;border:0;border-radius:8px;background:#3E8FD9;color:#fff;font-weight:700;padding:9px 14px;">'+(record?'Save Changes':'Add Record')+'</button></div></form></div>';document.body.appendChild(o);MAC_RECORD_={sectionId:sectionId,record:record||null};}
  function openAddMacRecord_(id){openMacModal_(id,null);} function openEditMacRecord_(){if(MAC_RECORD_)openMacModal_(MAC_RECORD_.sectionId,MAC_RECORD_.record);}
  function saveMacRecord_(){var ctx=MAC_RECORD_,error=document.getElementById('macRecordError'),button=document.getElementById('macRecordSave');if(!ctx)return;var p={};macFields_(ctx.sectionId).forEach(function(k){p[k]=(document.getElementById('mac-'+k)||{}).value||'';p[k]=p[k].trim();});if(!p.empId&&!p.empName&&!p.macAddress){error.textContent='Enter Employee ID, Employee Name or MAC Address.';error.style.display='block';return;}if(ctx.record){p.originalEmpId=ctx.record.empId||'';p.originalEmpName=ctx.record.empName||'';p.originalMac=ctx.record.macAddress||'';}button.disabled=true;button.textContent='Saving…';google.script.run.withSuccessHandler(function(r){if(!r||!r.ok){button.disabled=false;button.textContent='Save Changes';error.textContent=(r&&r.message)||'Could not save MAC record.';error.style.display='block';return;}closeModal();showToast('MAC record saved ✓');refreshMacData_(ctx.sectionId);}).withFailureHandler(function(e){button.disabled=false;error.textContent=(e&&e.message)||'Could not save MAC record.';error.style.display='block';})[ctx.record?'updateMacRecord':'addMacRecord'](ctx.sectionId,p);}
  function refreshMacData_(id){var fn={mac_office:'getMacOfficeAssetData',mac_client:'getMacClientLaptopData',mac_firewall:'getMacFirewallData'}[id];google.script.run.withSuccessHandler(function(data){if(!data||data.error)return;SHEET_DATA[id]=data;var entry=SECTION_INDEX[id];if(entry&&document.getElementById('section-'+id))onSectionData(entry.section,data);}).withFailureHandler(function(){} )[fn]();}

  function recordDateValues_(record) {
    var output = [];
    Object.keys(record || {}).forEach(function (key) {
      if (key.toLowerCase().indexOf('date') === -1) return;
      var text = String(record[key] || '').trim();
      if (!text) return;
      var d = new Date(text);
      if (isNaN(d.getTime())) {
        var m = text.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
        var months = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
        if (m && months.hasOwnProperty(m[2].toLowerCase())) d = new Date(Number(m[3]), months[m[2].toLowerCase()], Number(m[1]));
      }
      if (!isNaN(d.getTime())) output.push({ key: key, text: text, time: new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() });
    });
    return output;
  }

  function runHomeDateFilter() {
    var box = document.getElementById('dateFilterResults');
    if (!box) return;
    var fromText = document.getElementById('dateFilterFrom').value;
    var toText = document.getElementById('dateFilterTo').value;
    var from = fromText ? new Date(fromText + 'T00:00:00').getTime() : null;
    var to = toText ? new Date(toText + 'T00:00:00').getTime() : null;
    var query = document.getElementById('dateFilterQuery').value.trim().toUpperCase();
    var workspace = document.getElementById('dateFilterWorkspace').value;
    if (from && to && from > to) { box.innerHTML = '<div class="gresult-empty">From date cannot be after To date.</div>'; return; }
    var matches = [];
    Object.keys(SECTION_INDEX).forEach(function (sectionId) {
      var idx = SECTION_INDEX[sectionId], data = SHEET_DATA[sectionId];
      if (!data || !Array.isArray(data.records) || (workspace && idx.workspace.title !== workspace)) return;
      data.records.forEach(function (record) {
        var dates = recordDateValues_(record);
        var textOk = !query || getRecordExtraHaystack(sectionId, record).toUpperCase().indexOf(query) > -1;
        var dateOk = (!from && !to) || dates.some(function (item) { return (!from || item.time >= from) && (!to || item.time <= to); });
        if (textOk && dateOk) matches.push({ sectionId: sectionId, record: record, dates: dates.filter(function (item) { return (!from || item.time >= from) && (!to || item.time <= to); }) });
      });
    });
    HOME_MATCHES = matches;
    if (!matches.length) { box.innerHTML = '<div class="gresult-empty">No existing records match these filters.</div>'; return; }
    box.innerHTML = '<div style="font-weight:700;margin:8px 0">' + matches.length + ' matching record(s)</div><div class="tbl-wrap"><table><thead><tr><th>Workspace / tab</th><th>Asset / record</th><th>Employee</th><th>Matching date</th><th>Status</th></tr></thead><tbody>' + matches.map(function (item, i) {
      var idx = SECTION_INDEX[item.sectionId], r = item.record;
      var dateText = item.dates.map(function (d) { return d.key + ': ' + d.text; }).join(' · ') || 'Any date';
      return '<tr style="cursor:pointer" onclick="openHomeGlobalDetail(' + i + ')"><td>' + esc(idx.workspace.title + ' / ' + idx.section.title) + '</td><td class="code">' + esc(r.code || r.name || r.item || '—') + '</td><td>' + esc(getRecordEmpName(item.sectionId, r) || r.empId || '—') + '</td><td>' + esc(dateText) + '</td><td>' + esc(r.status || '—') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  }

  function clearHomeDateFilter() {
    ['dateFilterFrom', 'dateFilterTo', 'dateFilterQuery', 'dateFilterWorkspace'].forEach(function (id) { document.getElementById(id).value = ''; });
    document.getElementById('dateFilterResults').innerHTML = '';
  }

  google.script.run.withSuccessHandler(function(r){ CURRENT_USER_IS_ADMIN = !!(r && r.admin); boot(); }).withFailureHandler(function(){ boot(); }).getDashboardAccessStatus();
</script>
