<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#F7F9FC; --panel:#FFFFFF; --navy:#24324A; --navy-2:#33445F;
    --amber:#C98224; --teal:#278A75; --red:#B83B36; --slate:#596579; --line:#DDE3EC;
    --purple:#6B5FC7; --pink:#C96FA8; --cyan:#347DBE; --lime:#6FA53D; --gold:#B88925;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:Inter,-apple-system,'Segoe UI',sans-serif;color:var(--navy);
       overflow-x:hidden;}
  .wrap{padding:18px 22px 40px;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @keyframes floatIcon{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-3px) rotate(-4deg);}}
  @keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(95,224,183,.5);}50%{box-shadow:0 0 0 6px rgba(95,224,183,0);}}
  @keyframes gradientShift{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes slideDown{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
  @keyframes modalIn{from{opacity:0;transform:translateY(18px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes overlayIn{from{opacity:0;}to{opacity:1;}}

  /* ---------- NEW: mindblowing extras ---------- */
  @keyframes iconFloat{0%,100%{transform:translateY(0) rotate(0deg) scale(1);}50%{transform:translateY(-5px) rotate(8deg) scale(1.08);}}
  @keyframes iconWiggle{0%,100%{transform:rotate(0deg);}25%{transform:rotate(-12deg);}75%{transform:rotate(12deg);}}
  @keyframes borderFlow{0%{background-position:0% 50%;}100%{background-position:200% 50%;}}
  @keyframes rainbowGlow{
    0%{box-shadow:0 0 0 0 rgba(124,111,224,.0);}
    50%{box-shadow:0 8px 24px -6px rgba(124,111,224,.35);}
    100%{box-shadow:0 0 0 0 rgba(124,111,224,.0);}
  }
  @keyframes sparklePop{
    0%{transform:translate(0,0) scale(0);opacity:1;}
    70%{opacity:1;}
    100%{transform:translate(var(--dx,20px),var(--dy,-30px)) scale(1);opacity:0;}
  }
  @keyframes toastIn{from{opacity:0;transform:translateY(-10px) translateX(-50%);}to{opacity:1;transform:translateY(0) translateX(-50%);}}
  @keyframes toastOut{from{opacity:1;}to{opacity:0;transform:translateY(-10px) translateX(-50%);}}
  @keyframes ringSpin{to{stroke-dashoffset:0;}}
  @keyframes shimmerSweep{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
  @keyframes flashUpdate{
    0%{background:rgba(95,224,183,.35);}
    100%{background:transparent;}
  }
  @keyframes tabGradient{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}

  /* ---------- NEWEST: extra color + icon animation flair ---------- */
  @keyframes iconColorShift{
    0%{filter:hue-rotate(0deg) saturate(1);}
    50%{filter:hue-rotate(35deg) saturate(1.4) brightness(1.08);}
    100%{filter:hue-rotate(0deg) saturate(1);}
  }
  @keyframes iconPop{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.18);}
  }
  @keyframes rainbowText{
    0%{background-position:0% 50%;}
    100%{background-position:200% 50%;}
  }
  @keyframes glowPulse{
    0%,100%{filter:drop-shadow(0 0 0 rgba(124,111,224,0));}
    50%{filter:drop-shadow(0 0 6px rgba(124,111,224,.55));}
  }

  .header{
    background:linear-gradient(120deg,#EAF0F7 0%,#DDE7F2 48%,#F4F7FB 100%);
    background-size:300% 300%;
    animation:fadeUp .5s ease both, gradientShift 6s ease infinite;
    border-radius:16px;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;color:var(--navy);
    box-shadow:0 10px 30px rgba(27,42,74,.22);position:relative;overflow:hidden;
  }
  .header::after{
    content:"";position:absolute;top:0;left:-150%;width:80%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.10),transparent);
    animation:shimmerSweep 5s ease-in-out infinite;
  }
  .header-left{display:flex;align-items:center;gap:12px;}
  .logo{width:42px;height:42px;border-radius:12px;
        background:conic-gradient(from 0deg,var(--amber),var(--pink),var(--cyan),var(--lime),var(--purple),var(--gold),var(--amber));
        display:flex;align-items:center;justify-content:center;font-size:19px;
        animation:floatIcon 3s ease-in-out infinite, spin 8s linear infinite;
        box-shadow:0 4px 18px rgba(227,155,60,.5);}
  .logo span{display:inline-block;animation:iconWiggle 2.2s ease-in-out infinite;}
  .header h1{margin:0;font-size:18px;font-weight:700;
             background:linear-gradient(90deg,var(--navy),var(--purple),var(--cyan),var(--navy));
             background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
             animation:rainbowText 4s linear infinite;}
  .header .sub{margin:2px 0 0;font-size:11.5px;color:#526176;}
  .header-right{display:flex;align-items:center;gap:10px;}
  .updated{font-size:11.5px;color:#526176;background:rgba(255,255,255,.08);padding:6px 12px;border-radius:20px;
            display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.14);
            transition:background .2s;}
  .updated:hover{background:rgba(255,255,255,.16);}
  .dot{width:7px;height:7px;border-radius:50%;background:#5FE0B7;animation:pulseDot 1.8s ease-in-out infinite;}

  /* Auto-refresh ring */
  .refresh-badge{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);
                  border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:5px 12px 5px 8px;
                  font-size:11px;color:#526176;cursor:pointer;transition:background .2s;}
  .refresh-badge:hover{background:rgba(255,255,255,.18);}
  .refresh-badge.spinning .ring-icon{animation:spin .7s linear infinite;}
  .ring-wrap{width:18px;height:18px;position:relative;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-bg{stroke:rgba(255,255,255,.18);}
  .ring-fg{stroke:#5FE0B7;stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
  .ring-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;}

  /* Toast */
  .toast{position:fixed;top:14px;left:50%;background:var(--navy);color:var(--navy);padding:9px 18px;border-radius:30px;
         font-size:12.5px;font-weight:600;box-shadow:0 10px 26px rgba(20,30,60,.3);z-index:100;
         display:flex;align-items:center;gap:8px;animation:toastIn .3s ease both;}
  .toast .dot{background:#5FE0B7;}

  /* ---------- GLOBAL SEARCH (the ONE search bar — across all sheets) ---------- */
  @keyframes rainbowBorder{
    0%{background-position:0% 50%;}
    100%{background-position:200% 50%;}
  }
  .global-search-wrap{
    background:linear-gradient(120deg,#EAF0F7,#DCE6F1 40%,#F3E9F6 70%,#F3F6FA);
    background-size:300% 300%;animation:gradientShift 6s ease infinite, fadeUp .5s ease both .03s;
    border-radius:16px;padding:3px;margin:14px 0 0;box-shadow:0 10px 28px rgba(27,42,74,.22);
    position:relative;
  }
  .global-search-wrap::before{
    content:"";position:absolute;inset:0;border-radius:16px;padding:2px;
    background:linear-gradient(90deg,var(--amber),var(--pink),var(--cyan),var(--lime),var(--purple),var(--amber));
    background-size:250% 100%;animation:rainbowBorder 5s linear infinite;
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.55;
  }
  .global-search-inner{background:transparent;border-radius:14px;padding:13px 16px;}
  .global-search-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;color:var(--navy);font-size:12.5px;font-weight:700;}
  .global-search-head .gicon{font-size:16px;animation:iconFloat 2.6s ease-in-out infinite, iconColorShift 3.5s ease-in-out infinite;}
  .global-search-head .ghint{font-weight:500;color:#526176;font-size:11px;}
  .global-searchbar{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.97);border-radius:11px;
             padding:11px 15px;transition:box-shadow .2s;box-shadow:0 2px 8px rgba(20,30,60,.06);}
  .global-searchbar:focus-within{box-shadow:0 0 0 3px rgba(124,111,224,.3), 0 4px 16px rgba(124,111,224,.2);}
  .global-searchbar input{flex:1;border:none;outline:none;font-size:14px;font-family:inherit;color:var(--navy);
                    background:transparent;}
  .global-searchbar input::placeholder{color:#A8B0C4;}
  .global-searchbar .sicon{font-size:16px;color:var(--purple);animation:iconFloat 4s ease-in-out infinite, iconColorShift 4s ease-in-out infinite;}
  .global-clear{cursor:pointer;font-size:11.5px;color:var(--slate);background:#EEF1F6;border:none;
                border-radius:20px;padding:4px 10px;display:none;transition:background .2s, transform .15s;}
  .global-clear:hover{background:#E2E7F0;transform:scale(1.05);}

  .global-results{display:none;margin-top:12px;background:#fff;border-radius:12px;padding:4px 0;
                   max-height:340px;overflow-y:auto;animation:slideDown .3s ease both;}
  .gresult-empty{padding:22px;text-align:center;color:var(--slate);font-size:12px;}
  .gresult-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);
               cursor:pointer;transition:background .15s ease, transform .15s ease;}
  .gresult-row:last-child{border-bottom:none;}
  .gresult-row:hover{background:#F6F9FF;transform:translateX(3px);}
  .source-badge{font-size:9.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;padding:3px 8px;
                border-radius:20px;white-space:nowrap;flex-shrink:0;}
  .source-badge.office{background:#2C9C8622;color:#2C9C86;}
  .source-badge.client{background:#3E8FD922;color:#3E8FD9;}
  .source-badge.other{background:#7C6FE022;color:#7C6FE0;}
  .source-badge.mobile{background:#E086C122;color:#C96FA8;}
  .source-badge.studio{background:#B8892522;color:#B88925;}
  .source-badge.courier{background:#347DBE22;color:#347DBE;}
  .source-badge.materialin{background:#2FA0C922;color:#2FA0C9;}
  .source-badge.mac_office{background:#3E8FD922;color:#3E8FD9;}
  .source-badge.mac_client{background:#6B5FC722;color:#6B5FC7;}
  .source-badge.mac_firewall{background:#B83B3622;color:#B83B36;}
  .source-badge.laptops{background:#2C9C8622;color:#2C9C86;}
  .gresult-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .gresult-title{font-size:12.5px;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gresult-sub{font-size:11px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gresult-count-pill{background:var(--navy);color:var(--navy);font-size:10.5px;font-weight:700;padding:5px 12px;
                      border-radius:20px;margin-left:8px;}

  /* ---------- STATUS FILTER CHIPS (e.g. Client Laptops: Active/Dispatched) ---------- */
  .status-filter-bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 16px;
                      animation:fadeUp .5s ease both .12s;}
  .status-filter-label{font-size:11px;font-weight:700;color:var(--slate);text-transform:uppercase;
                        letter-spacing:.4px;margin-right:2px;}
  .status-chip{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:20px;
               background:var(--panel);border:1.5px solid var(--line);cursor:pointer;
               font-size:12px;font-weight:700;color:var(--slate);transition:all .2s ease;}
  .status-chip:hover{transform:translateY(-1px);border-color:#C7D0E4;}
  .status-chip .chip-icon{font-size:13px;animation:iconFloat 3s ease-in-out infinite;}
  .status-chip .chip-count{background:rgba(0,0,0,.06);padding:1px 7px;border-radius:20px;font-size:10.5px;}
  .status-chip.active{color:#fff;border-color:transparent;background:var(--accent,var(--navy));
                       box-shadow:0 6px 14px -4px rgba(20,30,60,.35);
                       animation:rainbowGlow 1.6s ease-in-out infinite;}
  .status-chip.active .chip-count{background:rgba(255,255,255,.25);}

  /* Dropdown-style filter (e.g. Client Laptops: Cyntexa Location) */
  .status-dropdown{
    font-family:inherit;font-size:12.5px;font-weight:700;color:var(--navy);
    background:var(--panel);border:1.5px solid var(--line);border-radius:20px;
    padding:8px 14px;cursor:pointer;outline:none;transition:border-color .2s, box-shadow .2s;
    box-shadow:0 1px 3px rgba(20,30,60,.05);
  }
  .status-dropdown:hover{border-color:#C7D0E4;}
  .status-dropdown:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(124,111,224,.18);}

  /* SECTION TABS */
  .section-tabs{display:flex;gap:8px;margin:16px 0 4px;animation:fadeUp .5s ease both .05s;flex-wrap:wrap;}
  .section-tab{display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;background:var(--panel);
               border:1.5px solid var(--line);cursor:pointer;font-size:13px;font-weight:700;color:var(--slate);
               transition:all .2s ease;box-shadow:0 1px 3px rgba(20,30,60,.05);}
  .section-tab:hover{border-color:#C7D0E4;color:var(--navy);transform:translateY(-1px);}
  .section-tab:hover .icon{animation:iconWiggle .5s ease, iconPop .5s ease;}
  .section-tab{position:relative;overflow:hidden;}
  .section-tab::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
    background:var(--tab-accent,var(--navy));transform:scaleX(0);transform-origin:left;
    transition:transform .25s ease;border-radius:3px 3px 0 0;}
  .section-tab.active::after{transform:scaleX(1);}
  #tab-office{--tab-accent:#E3963C;}
  #tab-client{--tab-accent:#3E8FD9;}
  #tab-other{--tab-accent:#7C6FE0;}
  #tab-mobile{--tab-accent:#C96FA8;}
  #tab-studio{--tab-accent:#B88925;}
  #tab-courier{--tab-accent:#347DBE;}
  #tab-materialin{--tab-accent:#2FA0C9;}
  #tab-mac_office{--tab-accent:#3E8FD9;}
  #tab-mac_client{--tab-accent:#6B5FC7;}
  #tab-mac_firewall{--tab-accent:#B83B36;}
  #tab-laptops{--tab-accent:#2C9C86;}
  .section-tab.active{
    background:linear-gradient(120deg,#DCE6F2,#C8D7E8,#E7EEF6);
    background-size:200% 200%;animation:tabGradient 4s ease infinite;
    border-color:var(--tab-accent,var(--navy));color:var(--navy);box-shadow:0 6px 16px rgba(27,42,74,.3);
  }
  .section-tab.active .icon{animation:iconFloat 3s ease-in-out infinite, iconColorShift 3s ease-in-out infinite;}
  .section-tab .icon{font-size:15px;display:inline-block;animation:iconFloat 3.5s ease-in-out infinite;}
  .section-tab .badge-count{font-size:10.5px;background:rgba(0,0,0,.08);padding:1px 8px;border-radius:20px;
    transition:background .2s;}
  .section-tab.active .badge-count{background:var(--tab-accent,rgba(36,50,74,.10));color:#fff;}

  .section{display:none;}
  .section.active{display:block;animation:fadeUp .35s ease both;}


  .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:18px 0;}
  .card{background:var(--panel);border-radius:12px;padding:14px 14px 12px;
        border-top:3px solid transparent;border-left:4px solid var(--accent,var(--navy));
        box-shadow:0 1px 3px rgba(20,30,60,.06);position:relative;overflow:hidden;
        cursor:pointer;animation:fadeUp .5s ease both, idleGlow 5s ease-in-out infinite;
        transition:transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s ease;}
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--accent,var(--navy)),#fff2,var(--accent,var(--navy)));
    background-size:200% 100%;animation:borderFlow 2.5s linear infinite;
  }
  .card::after{content:"";position:absolute;inset:0;
    background:radial-gradient(120px 80px at 90% 0%, var(--accent,var(--navy)) 0%, transparent 70%);
    opacity:0;transition:opacity .3s ease;pointer-events:none;}
  .card:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 16px 32px -8px rgba(20,30,60,.28);}
  .card:hover::after{opacity:.12;}
  .card:hover .card-icon{animation:iconWiggle .5s ease-in-out, iconPop .5s ease-in-out;}
  .card.selected{outline:2px solid var(--accent,var(--navy));outline-offset:-2px;animation:rainbowGlow 1.6s ease-in-out infinite;}
  .card.just-updated{animation:flashUpdate 1.1s ease;}
  .card .label{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--slate);
               display:flex;align-items:center;justify-content:space-between;}
  .card-icon{font-size:16px;transition:transform .28s cubic-bezier(.34,1.56,.64,1);display:inline-block;
             animation:iconFloat 3s ease-in-out infinite, iconColorShift 4.5s ease-in-out infinite;}
  .card .value{font-size:24px;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums;}
  .card .tap-hint{font-size:9.5px;color:var(--slate);margin-top:3px;opacity:.7;}

  @keyframes idleGlow{
    0%,100%{box-shadow:0 1px 3px rgba(20,30,60,.06);}
    50%{box-shadow:0 6px 18px -6px var(--accent,rgba(20,30,60,.2));}
  }

  .grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-bottom:14px;}
  .panel{background:var(--panel);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(20,30,60,.06);
         animation:fadeUp .55s ease both;transition:box-shadow .25s ease;}
  .panel:hover{box-shadow:0 10px 24px -10px rgba(20,30,60,.18);}
  .panel h3{margin:0 0 3px;font-size:13px;display:flex;align-items:center;gap:6px;}
  .panel h3 span{animation:iconFloat 3s ease-in-out infinite;}
  .panel .desc{font-size:11px;color:var(--slate);margin:0 0 10px;}

  .records-section{display:none;overflow:visible;animation:slideDown .35s ease both;}
  /* Keep the full records table reachable; never clip rows at the bottom. */
  .records-section .tbl-wrap{overflow-x:auto;overflow-y:visible;max-height:none;}
  .records-section table{min-width:100%;}
  .records-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
  .records-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;}
  .records-title span:first-child{animation:iconFloat 2.5s ease-in-out infinite, iconColorShift 4s ease-in-out infinite;}
  .records-count{font-size:11px;color:var(--slate);font-weight:500;}
  .close-records{cursor:pointer;background:#EEF1F6;border:none;border-radius:8px;padding:5px 10px;font-size:11px;
                  color:var(--slate);transition:background .2s;}
  .close-records:hover{background:#E2E7F0;}

  table{width:100%;border-collapse:collapse;font-size:12px;}
  thead th{text-align:left;font-size:10px;text-transform:uppercase;color:var(--slate);padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
  tbody tr{transition:background .18s ease, transform .18s ease;cursor:pointer;}
  tbody tr:hover{background:#F6F9FF;transform:translateX(2px);}
  tbody td{padding:9px 8px;border-bottom:1px solid var(--line);}
  .code{font-weight:700;color:var(--navy-2);}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap;
         transition:transform .18s ease;}
  tbody tr:hover .badge{transform:scale(1.08);}
  .no-results{padding:30px;text-align:center;color:var(--slate);font-size:12.5px;}
  .tbl-wrap{overflow-x:auto;}

  .loading{padding:70px;text-align:center;color:var(--slate);font-size:13px;display:flex;flex-direction:column;
            align-items:center;gap:12px;}
  .spinner{width:26px;height:26px;border:3px solid #DCE3F0;border-top-color:var(--purple);border-radius:50%;
           animation:spin .8s linear infinite;}
  .errbox{padding:16px;background:#FBE9E7;color:var(--red);border-radius:10px;font-size:12.5px;animation:fadeUp .3s ease;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(36,50,74,.28);display:flex;align-items:center;justify-content:center;
           z-index:50;animation:overlayIn .2s ease;backdrop-filter:blur(2px);}
  .modal{background:#fff;border-radius:16px;padding:22px 24px 24px;width:420px;max-width:90vw;max-height:80vh;overflow-y:auto;
         box-shadow:0 24px 60px rgba(10,20,40,.35);animation:modalIn .28s cubic-bezier(.2,.8,.2,1);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .modal-head h4{margin:0;font-size:15px;color:var(--navy-2);}
  .modal-close{cursor:pointer;background:#EEF1F6;border:none;border-radius:8px;width:26px;height:26px;font-size:13px;
               color:var(--slate);}
  .modal-close:hover{background:#E2E7F0;}
  .modal-badge{margin-bottom:14px;}
  .detail-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .detail-row:last-child{border-bottom:none;}
  .detail-row .k{color:var(--slate);flex-shrink:0;}
  .detail-row .v{font-weight:600;text-align:right;}

  /* sparkle particles for confetti burst */
  .sparkle{position:fixed;pointer-events:none;font-size:14px;z-index:200;
           animation:sparklePop .8s ease-out forwards;}

  /* ---------- LIGHT / READABLE THEME ---------- */
  body{color:#24324A;}

  .workspace-view{display:block;}

  .ws-header{
    background:linear-gradient(120deg,#EAF0F7 0%,#DDE7F2 48%,#F4F7FB 100%);
    background-size:300% 300%;animation:fadeUp .5s ease both, gradientShift 6s ease infinite;
    border-radius:16px;padding:26px 28px;box-shadow:0 10px 30px rgba(27,42,74,.22);
    margin-bottom:22px;position:relative;overflow:hidden;
  }
  .ws-header::after{
    content:"";position:absolute;top:0;left:-150%;width:80%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.10),transparent);
    animation:shimmerSweep 5s ease-in-out infinite;
  }
  .ws-header-top{display:flex;align-items:center;gap:12px;}
  .ws-header h1{margin:0;font-size:20px;font-weight:800;
             background:linear-gradient(90deg,var(--navy),var(--purple),var(--cyan),var(--navy));
             background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
             animation:rainbowText 4s linear infinite;}
  .ws-header .sub{margin:4px 0 0;font-size:12.5px;color:#526176;}
  .ws-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
  .ws-card{background:var(--panel);border-radius:16px;padding:20px 20px 18px;cursor:pointer;
           border:1.5px solid var(--line);box-shadow:0 1px 3px rgba(20,30,60,.06);
           transition:transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s ease, border-color .2s;
           position:relative;overflow:hidden;animation:fadeUp .5s ease both;}
  .ws-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg,var(--amber),var(--pink),var(--cyan),var(--lime),var(--purple),var(--amber));
    background-size:250% 100%;animation:rainbowBorder 5s linear infinite;
  }
  .ws-card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 16px 32px -8px rgba(20,30,60,.28);border-color:#C7D0E4;}
  .ws-card:hover .ws-icon{animation:iconWiggle .5s ease-in-out, iconPop .5s ease-in-out;}
  .ws-icon{font-size:30px;display:inline-block;animation:iconFloat 3s ease-in-out infinite, iconColorShift 4.5s ease-in-out infinite;}
  .ws-card h3{margin:12px 0 4px;font-size:15px;font-weight:800;color:var(--navy);}

  .ws-card .ws-enter{font-size:11.5px;font-weight:700;color:var(--purple);display:flex;align-items:center;gap:5px;}

  function animateValue(el, end, duration) {
    var start = 0, startTime = null;
    function step(ts) {
      if (!startTime) startTime = ts;
      var progress = Math.min((ts - startTime) / duration, 1);
      var eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = Math.round(eased * end);
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

      var dist = 30 + Math.random() * 40;
      el.style.setProperty("--dx", (Math.cos(angle) * dist) + "px");
      el.style.setProperty("--dy", (Math.sin(angle) * dist) + "px");
      el.style.left = x + "px";

  function downloadActivityLogReport_() {
    var modeEl = document.getElementById('activityReportMode');
    var dateEl = document.getElementById('activityReportDate');
    var monthEl = document.getElementById('activityReportMonth');
    var button = document.getElementById('activityReportDownload');
    if (!modeEl || !button) return;
    var mode = modeEl.value || 'daily';
    var value = mode === 'monthly' ? (monthEl ? monthEl.value : '') : (dateEl ? dateEl.value : '');
    if (!value) {
      showToast(mode === 'monthly' ? 'Please select a month' : 'Please select a date');
      return;
    }
    button.disabled = true;
    button.textContent = 'Preparing Excel…';
    google.script.run
      .withSuccessHandler(function (result) {
        button.disabled = false;
        button.textContent = '⬇ Download Excel';
        if (!result || !result.ok || !result.base64) {
          showToast('Could not create the Excel report');
          return;
        }
        try {
          var binary = atob(result.base64), bytes = new Uint8Array(binary.length);
          for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          var blob = new Blob([bytes], { type: result.mimeType || 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
          var url = URL.createObjectURL(blob), link = document.createElement('a');
          link.href = url;
          link.download = result.filename || ('Activity_Logs_' + mode + '_' + value + '.xlsx');
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
          showToast(result.count + ' log' + (result.count === 1 ? '' : 's') + ' exported ✓');
        } catch (e) {
          showToast('Excel download failed');
        }
      })
      .withFailureHandler(function (error) {
        button.disabled = false;
        button.textContent = '⬇ Download Excel';
        showToast((error && error.message) || 'Could not create the Excel report');
      })
      .downloadActivityLogReport({ mode: mode, value: value });
  }

  /* ============================================================
   * PRELOAD — silently warms dashboard data in the background. The
   * first/visible tab is prioritized; remaining tabs are loaded after
   * a short delay so opening a workspace is not blocked by every sheet.
   * SHEET_DATA/SECTION_INDEX are kept in sync for Global Search.
   * ============================================================ */
  var SHEET_DATA = {};     // sectionId -> latest data
  var SECTION_INDEX = {};  // sectionId -> { workspace, section }

  function preloadAllSections() {
    // Build the index first so workspace opening can immediately reuse data
    // that is already being fetched in the background.
    var firstSections = [];
    var remainingSections = [];

    WORKSPACES.forEach(function (w) {
      w.sections.forEach(function (s, index) {
        SECTION_INDEX[s.id] = { workspace: w, section: s };
        (index === 0 ? firstSections : remainingSections).push(s);
      });
    });

    // Prioritize the first/visible tab of every workspace.
    firstSections.forEach(function (s) { preloadSection_(s, 0); });

    // Do not compete with the visible dashboard during its first few seconds.
    remainingSections.forEach(function (s, index) {
      preloadSection_(s, 500 + index * 35);
    });
  }

  function preloadSection_(s, delay) {
    setTimeout(function () {
      if (SHEET_DATA[s.id] || SECTION_LOADING[s.id]) return;
      SECTION_LOADING[s.id] = true;

      google.script.run
        .withSuccessHandler(function (data) {
          SECTION_LOADING[s.id] = false;
          if (!data || data.error) return;
          data._loadedAt = Date.now();
          SHEET_DATA[s.id] = data;

          // If this section is currently visible, render it immediately.
          if (activeWorkspace && activeWorkspace.sections.some(function (x) { return x.id === s.id; }) &&
              document.getElementById('section-' + s.id)) {
            onSectionData(s, data);
          }
        })
        .withFailureHandler(function () {
          SECTION_LOADING[s.id] = false;
        })
        [s.fetchFn]();
    }, delay || 0);
  }

  /* ============================================================

  function openWorkspace(wsId) {

  function switchSection(id) {
    activeSection = id;
    document.querySelectorAll('.section-tab').forEach(function (t) {
      t.classList.toggle('active', t.id === 'tab-' + id);

      sec.classList.toggle('active', sec.id === 'section-' + id);

    if (id === 'activity_logs') {
      loadSection(activeWorkspace.sections.filter(function (x) { return x.id === id; })[0], true);
    }

    var s = activeWorkspace.sections.filter(function (x) { return x.id === id; })[0];
    if (SECTION_STATE[id] && SECTION_STATE[id].data) {
      if (s.showCharts) renderCharts(s);

  function loadSection(s, isVisible) {
    if (!s || !s.id) return;
    if (SECTION_LOADING[s.id]) return;

    SECTION_LOADING[s.id] = true;
    google.script.run
      .withSuccessHandler(function (data) {
        SECTION_LOADING[s.id] = false;
        if (!data || data.error) {
          onSectionError(s, data || { message: 'Could not load data.' });
          return;
        }
        data._loadedAt = Date.now();
        SHEET_DATA[s.id] = data;
        onSectionData(s, data);

        if (s.id === 'activity_logs') {
          google.script.run
            .withSuccessHandler(function (v) {
              if (v) activityLogVersion = v;

            .withFailureHandler(function () {})
            .getActivityLogVersion();

      .withFailureHandler(function (err) {
        SECTION_LOADING[s.id] = false;
        onSectionError(s, err);
      })
      [s.fetchFn]();
  }

    document.getElementById('globalUpdated').innerHTML = '<span class="dot"></span>' + s.title + ' updated ' + data.updated;

    var counts = data.counts;
    var labels = Object.keys(counts);

    var cardsHtml = '';

  function renderCharts(s) {
    if (!s.showCharts) return;
    var state = SECTION_STATE[s.id];
    if (!state) return;
    var counts = state.data.counts;
    var labels = Object.keys(counts);
    var values = labels.map(function (l) { return counts[l]; });
    var colors = labels.map(function (l) { return metaFor(l).color; });

    if (!state.charts) state.charts = {};
    if (state.charts.bar) state.charts.bar.destroy();
    if (state.charts.pie) state.charts.pie.destroy();

    var barCanvas = document.getElementById('bar-' + s.id);
    var pieCanvas = document.getElementById('pie-' + s.id);
    if (!barCanvas || !pieCanvas) return;

    state.charts.bar = new Chart(barCanvas, {
      type: 'bar',
      data: { labels: labels, datasets: [{ data: values, backgroundColor: colors, borderRadius: 7, barThickness: 30 }] },
      options: {
        animation: { duration: 900, easing: 'easeOutQuart' },
        onClick: function (evt, els) { if (els.length) openRecords(s.id, labels[els[0].index], evt.native); },
        plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1B2A4A', padding: 10, cornerRadius: 8, displayColors: false } },
        scales: { y: { beginAtZero: true, grid: { color: "#EEF1F6" } }, x: { grid: { display: false } } },
        onHover: function (evt, els) { evt.native.target.style.cursor = els.length ? 'pointer' : 'default'; }
      }
    });

    state.charts.pie = new Chart(pieCanvas, {
      type: 'doughnut',
      data: { labels: labels, datasets: [{ data: values, backgroundColor: colors, borderWidth: 3, borderColor: "#fff", hoverOffset: 10 }] },
      options: {
        cutout: '62%',
        animation: { animateRotate: true, animateScale: true, duration: 900, easing: 'easeOutBack' },
        onClick: function (evt, els) { if (els.length) openRecords(s.id, labels[els[0].index], evt.native); },
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }, tooltip: { backgroundColor: '#1B2A4A', padding: 10, cornerRadius: 8, displayColors: false } },
        onHover: function (evt, els) { evt.native.target.style.cursor = els.length ? 'pointer' : 'default'; }
      }
    });
  }

  function openRecords(sectionId, status, evt) {
    if (evt) burstSparkles(evt.clientX, evt.clientY);
    var state = SECTION_STATE[sectionId];
    state.currentFilter = (status === '__ALL__') ? null : status;

    document.querySelectorAll('#section-' + sectionId + ' .card').forEach(function (c) {
      c.classList.toggle('selected', c.getAttribute('data-status') === status);
    });
    var s = activeWorkspace.sections.filter(function (x) { return x.id === sectionId; })[0];
    var m = state.currentFilter ? metaFor(state.currentFilter) : { icon: s.icon };
    document.getElementById('recIcon-' + sectionId).textContent = m.icon;
    document.getElementById('recTitle-' + sectionId).textContent = state.currentFilter ? (state.currentFilter + ' Items') : ('All ' + s.title);
    document.getElementById('records-' + sectionId).style.display = 'block';
    renderTable(sectionId);
    document.getElementById('records-' + sectionId).scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function closeRecords(sectionId) {
    document.getElementById('records-' + sectionId).style.display = 'none';
    document.querySelectorAll('#section-' + sectionId + ' .card').forEach(function (c) { c.classList.remove('selected'); });
    SECTION_STATE[sectionId].currentFilter = null;
    SECTION_STATE[sectionId].statusFilter = null;
    var s = activeWorkspace.sections.filter(function (x) { return x.id === sectionId; })[0];
    if (s.statusFilterType === 'dropdown') {
      var dd = document.getElementById('statusDropdown-' + sectionId);
      if (dd) dd.value = '__ALL__';
    } else {
      document.querySelectorAll('#statusFilter-' + sectionId + ' .status-chip').forEach(function (c) {
        c.classList.toggle('active', c.getAttribute('data-sf') === '__ALL__');
      });
    }
  }

  function toggleStatusFilter(sectionId, status) {
    var state = SECTION_STATE[sectionId];
    if (!state) return;
    var s = activeWorkspace.sections.filter(function (x) { return x.id === sectionId; })[0];

    var newVal = (status === '__ALL__') ? null : status;
    if (state.statusFilter === newVal) newVal = null; // clicking the same chip again clears it
    state.statusFilter = newVal;

    document.querySelectorAll('#statusFilter-' + sectionId + ' .status-chip').forEach(function (c) {
      var cs = c.getAttribute('data-sf');
      var isActive = newVal === null ? (cs === '__ALL__') : (cs === newVal);
      c.classList.toggle('active', isActive);
    });

    var recordsBox = document.getElementById('records-' + sectionId);
    if (recordsBox.style.display !== 'block') {
      document.getElementById('recTitle-' + sectionId).textContent = state.currentFilter ? (state.currentFilter + ' Items') : ('All ' + s.title);
      document.getElementById('recIcon-' + sectionId).textContent = state.currentFilter ? metaFor(state.currentFilter).icon : s.icon;
      recordsBox.style.display = 'block';
    }
    renderTable(sectionId);
    recordsBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function onDropdownFilterChange(sectionId) {
    var select = document.getElementById('statusDropdown-' + sectionId);
    var state = SECTION_STATE[sectionId];
    if (!state || !select) return;
    var val = select.value;
    state.statusFilter = (val === '__ALL__') ? null : val;

    var s = activeWorkspace.sections.filter(function (x) { return x.id === sectionId; })[0];
    var recordsBox = document.getElementById('records-' + sectionId);
    if (recordsBox.style.display !== 'block') {
      document.getElementById('recTitle-' + sectionId).textContent = state.currentFilter ? (state.currentFilter + ' Items') : ('All ' + s.title);
      document.getElementById('recIcon-' + sectionId).textContent = state.currentFilter ? metaFor(state.currentFilter).icon : s.icon;
      recordsBox.style.display = 'block';
    }
    renderTable(sectionId);
    recordsBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function addAccessUser_() {
    var input = document.getElementById('accessEmailInput');
    if (!input) return;
    var email = input.value.trim();
    if (!email) { showToast('Enter an email address'); return; }
    input.disabled = true;
    google.script.run
      .withSuccessHandler(function (r) {
        input.disabled = false;
        if (r && r.ok) {
          input.value = '';
          showToast('Access added ✓');
          loadSection(SECTION_INDEX.access.section, true);
        }
      })
      .withFailureHandler(function (e) {
        input.disabled = false;
        showToast((e && e.message) || 'Could not add access');
      })
      .addDashboardAuthorizedEmail(email);
  }

  function removeAccessUser_(email) {
    if (!confirm('Remove dashboard access for ' + email + '?')) return;
    google.script.run
      .withSuccessHandler(function () {
        showToast('Access removed ✓');
        loadSection(SECTION_INDEX.access.section, true);
      })
      .withFailureHandler(function (e) { showToast((e && e.message) || 'Could not remove access'); })
      .removeDashboardAuthorizedEmail(email);
  }

  function renderAccessTable_() {
    var state = SECTION_STATE.access;
    if (!state) return;
    var list = state.data.records || [];
    document.getElementById('recCount-access').textContent = list.length + ' authorized user' + (list.length === 1 ? '' : 's');
    var body = document.getElementById('recBody-access');
    var noRes = document.getElementById('noResults-access');
    if (!list.length) {
      body.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:24px;color:#7A8496">No users added yet. Add an email above.</td></tr>';
      noRes.style.display = 'none';
      return;
    }
    noRes.style.display = 'none';
    body.innerHTML = list.map(function (r) {
      return '<tr>' +
        '<td class="code">' + esc(r.email) + '</td>' +
        '<td>' + esc(r.email) + '</td>' +
        '<td><span class="badge" style="' + badgeStyle('AUTHORIZED') + '">✓ AUTHORIZED</span></td>' +
        '<td style="text-align:right"><button type="button" onclick="event.stopPropagation();removeAccessUser_(\'' + esc(r.email).replace(/'/g, "\\'") + '\')" style="cursor:pointer;border:0;border-radius:7px;background:#FDECEC;color:#B42318;font-weight:700;padding:7px 10px;font-size:12px;">Remove</button></td>' +
        '</tr>';
    }).join('');
    state.currentList = list;
  }

  function renderTable(sectionId) {
    var s = activeWorkspace.sections.filter(function (x) { return x.id === sectionId; })[0];
    if (s && s.accessManager) { renderAccessTable_(); return; }
    var state = SECTION_STATE[sectionId];
    var gKey = s.groupField || 'status';

    var list = state.data.records.filter(function (r) {
      var groupOk = (s.flatList || !state.currentFilter) ? true : r[gKey] === state.currentFilter;
      if (!groupOk) return false;
      if (s.statusFilterField && state.statusFilter) {
        var sfOk = String(r[s.statusFilterField] || 'UNKNOWN').trim().toUpperCase() === state.statusFilter;
        if (!sfOk) return false;
      }
      return true;
    });

    document.getElementById('recCount-' + sectionId).textContent = list.length + ' record' + (list.length === 1 ? '' : 's');
    var body = document.getElementById('recBody-' + sectionId);
    var noRes = document.getElementById('noResults-' + sectionId);

    if (!list.length) {
      body.innerHTML = '';
      noRes.style.display = 'block';
      return;
    }
    noRes.style.display = 'none';

    body.innerHTML = list.map(function (r, i) {
      var m = metaFor(r.status);
      var cells = s.tableCols.map(function (c) { return '<td>' + (esc(r[c.key]) || '—') + '</td>'; }).join('');
      var statusCell = s.hideStatusColumn ? '' : ('<td><span class="badge" style="' + badgeStyle(r.status) + '">' + m.icon + ' ' + esc(r.status) + '</span></td>');
      return '<tr onclick="showDetail(\'' + sectionId + '\',' + i + ')">' +
        '<td class="code">' + (esc(getDisplayAssetCode(s, r)) || '—') + '</td>' +
        statusCell +
        cells +
        '</tr>';
    }).join('');

    state.currentList = list;
  }

  function showDetail(sectionId, idx) {
    var s = activeWorkspace.sections.filter(function (x) { return x.id === sectionId; })[0];
    var r = SECTION_STATE[sectionId].currentList[idx];
    renderRecordDetail(s, r);
  }

  function renderRecordDetail(s, r) {
    var m = metaFor(r.status);

    var rowsHtml = s.detailFields.map(function (f) {
      return '<div class="detail-row"><span class="k">' + esc(f.label) + '</span><span class="v">' + (esc(r[f.key]) || '—') + '</span></div>';
    }).join('');

    /* Primary column value shown in the row/modal (MAC address for
       mac_client / mac_firewall, resolved Asset Code for mac_office,
       r.code for every other section — see getDisplayAssetCode). */
    var codeDisplay = getDisplayAssetCode(s, r);
    var primaryLabel = s.primaryLabel || 'Asset Code';
    var assetCodeRow = codeDisplay
      ? '<div class="detail-row"><span class="k">' + esc(primaryLabel) + '</span><span class="v">' + esc(codeDisplay) + '</span></div>'
      : '';

    /* Modal heading: uses s.titleKey (e.g. Employee Name for
       mac_client / mac_firewall) when available, otherwise falls
       back to r.code. */
    var titleText = (s.titleKey && r[s.titleKey]) ? r[s.titleKey] : r.code;

    var badgeInner = (s.hideStatusColumn ? '' : ('<span class="badge" style="' + badgeStyle(r.status) + '">' + m.icon + ' ' + esc(r.status) + '</span> ')) +
      '<span class="source-badge ' + s.id + '" style="margin-left:6px;">' + esc(s.icon) + ' ' + esc(s.title) + '</span>';

    var overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.onclick = function (e) { if (e.target === overlay) closeModal(); };
    overlay.innerHTML =
      '<div class="modal">' +
      '<div class="modal-head"><h4>' + esc(titleText) + '</h4><button class="modal-close" onclick="closeModal()">✕</button></div>' +
      '<div class="modal-badge">' + badgeInner + '</div>' +
      assetCodeRow +
      rowsHtml +
      '</div>';
    document.body.appendChild(overlay);
  }

  /* ============================================================
   * GLOBAL SEARCH — searches Employee ID / Employee Name / MAC
   * Address across ALL sheets (Office + Client + Other + Mobile +
   * Studio + Courier + Material IN + MAC tabs) and shows a unified
   * result list, regardless of which tab is currently active.
   * Studio Items has no Employee ID/Name, so it's matched on Item
   * Name / Checked By / Serial / Model / Location instead. Courier
   * Data has no Employee ID, so it's matched on Employee Name /
   * Client Name / Courier Name / Consignment No instead. Material
   * IN has no Employee ID either, so it's matched on Item / Material
   * Description / From / Checked By / Location instead. The MAC
   * tabs (mac_office / mac_client / mac_firewall) are additionally
   * matched on MAC Address / Other MAC / resolved Asset Code.
   * ============================================================ */
  function getRecordEmpName(sectionId, r) {
    if (sectionId === 'client') return r.userName || '';
    if (sectionId === 'studio') return r.checkedBy || '';
    if (sectionId === 'courier') return r.empName || '';
    if (sectionId === 'materialin') return r.checkedBy || '';
    return r.empName || '';
  }

  function getRecordSubtitle(sectionId, r) {
    if (sectionId === 'client') {
      var bits = [];
      if (r.clientName) bits.push(r.clientName);
      if (r.cyntexaLoc) bits.push(r.cyntexaLoc);
      if (r.makeModel) bits.push(r.makeModel);
      return bits.join(' · ');
    }
    if (sectionId === 'other') {
      var bits3 = [];
      if (r.category) bits3.push(r.category);
      if (r.location) bits3.push(r.location);
      if (r.remarks) bits3.push(r.remarks);
      return bits3.join(' · ');
    }
    if (sectionId === 'mobile') {
      var bits4 = [];
      if (r.category) bits4.push(r.category);
      if (r.configuration) bits4.push(r.configuration);
      if (r.remarks) bits4.push(r.remarks);
      return bits4.join(' · ');
    }
    if (sectionId === 'studio') {
      var bits5 = [];
      if (r.category) bits5.push(r.category);
      if (r.location) bits5.push(r.location);
      if (r.qty) bits5.push('Qty: ' + r.qty);
      if (r.remarks) bits5.push(r.remarks);
      return bits5.join(' · ');
    }
    if (sectionId === 'courier') {
      var bits6 = [];
      if (r.clientName) bits6.push(r.clientName);
      if (r.courierName) bits6.push(r.courierName);
      if (r.consignmentNo) bits6.push('Consgn: ' + r.consignmentNo);
      if (r.dispatchDate) bits6.push('Dispatched ' + r.dispatchDate);
      return bits6.join(' · ');
    }
    if (sectionId === 'materialin') {
      var bits7 = [];
      if (r.category) bits7.push(r.category);
      if (r.fromVendor) bits7.push('From: ' + r.fromVendor);
      if (r.qty) bits7.push('Qty: ' + r.qty);
      if (r.date) bits7.push('Received ' + r.date);
      return bits7.join(' · ');
    }
    if (sectionId === 'mac_office') {
      var bits8 = [];
      if (r.location) bits8.push(r.location);
      if (r.otherMac) bits8.push('Other: ' + r.otherMac);
      if (r.remarks) bits8.push(r.remarks);
      return bits8.join(' · ');
    }
    if (sectionId === 'mac_client') {
      var bits9 = [];
      if (r.clientName) bits9.push(r.clientName);
      if (r.otherMac) bits9.push('Other: ' + r.otherMac);
      if (r.remarks) bits9.push(r.remarks);
      return bits9.join(' · ');
    }
    if (sectionId === 'mac_firewall') {
      var bits10 = [];
      if (r.macAddress) bits10.push(r.macAddress);
      if (r.remarks) bits10.push(r.remarks);
      return bits10.join(' · ');
    }
    if (sectionId === 'laptops') {
      var bits11 = [];
      if (r.assetType) bits11.push(r.assetType);
      if (r.serialNumber) bits11.push('SN: ' + r.serialNumber);
      if (r.purchasedFrom) bits11.push(r.purchasedFrom);
      return bits11.join(' · ');
    }
    var bits2 = [];
    if (r.date) bits2.push('Assigned ' + r.date);
    if (r.remarks) bits2.push(r.remarks);
    return bits2.join(' · ');
  }

  function getRecordExtraHaystack(sectionId, r) {
    // Every record value is searchable: serial/IMEI/MAC/model/client/remarks etc.
    return Object.keys(r || {}).map(function (key) {
      var value = r[key];
      if (value === null || value === undefined) return '';
      return typeof value === 'object' ? JSON.stringify(value) : String(value);
    }).join(' ');
  }

  function onGlobalSearch() {
    if (globalSearchTimer) clearTimeout(globalSearchTimer);
    globalSearchTimer = setTimeout(runGlobalSearch, 80);
  }

  function runGlobalSearch() {
    var input = document.getElementById('globalSearchInput');
    var q = input.value.trim().toUpperCase();
    var clearBtn = document.getElementById('globalClearBtn');
    var resultsBox = document.getElementById('globalResults');
    clearBtn.style.display = q ? 'inline-block' : 'none';

    if (!q) {
      resultsBox.style.display = 'none';
      resultsBox.innerHTML = '';
      return;
    }

    // Global Search must search every non-admin section across all workspaces,
    // not only the currently open workspace.
    var SECTIONS_LOCAL = [];
    WORKSPACES.forEach(function (w) {
      w.sections.forEach(function (s) {
        if (!s.adminOnly || CURRENT_USER_IS_ADMIN) SECTIONS_LOCAL.push(s);
      });
    });

    var notReady = SECTIONS_LOCAL.filter(function (s) { return !SECTION_STATE[s.id] || !SECTION_STATE[s.id].data; });
    if (notReady.length) {
      // Use data that is already loaded instead of blocking the search because
      // another section is still warming in the background.
      SECTIONS_LOCAL = SECTIONS_LOCAL.filter(function (s) {
        return SECTION_STATE[s.id] && SECTION_STATE[s.id].data && !SECTION_STATE[s.id].data.error;
      });
    }

    var matches = [];
    SECTIONS_LOCAL.forEach(function (s) {
      var recs = SECTION_STATE[s.id].data.records || [];
      recs.forEach(function (r, ri) {
        var empId = String(r.empId || '');
        var empName = getRecordEmpName(s.id, r);
        var extra = getRecordExtraHaystack(s.id, r);
        var haystack = SECTION_STATE[s.id].data._search ? SECTION_STATE[s.id].data._search[ri] : (empId + ' ' + empName + ' ' + r.code + ' ' + extra).toUpperCase();
        if (haystack.indexOf(q) > -1) {
          matches.push({ section: s, record: r });
        }
      });
    });

    if (!matches.length) {
      resultsBox.style.display = 'block';
      resultsBox.innerHTML = '<div class="gresult-empty">No matching records in either sheet for "' + esc(input.value.trim()) + '".</div>';
      GLOBAL_MATCHES = [];
      return;
    }

    GLOBAL_MATCHES = matches;
    resultsBox.style.display = 'block';
    resultsBox.innerHTML = matches.map(function (item, i) {
      var s = item.section, r = item.record;
      var m = metaFor(r.status);
      var sub = getRecordSubtitle(s.id, r);
      var titleHtml;
      if (s.id === 'studio') {
        titleHtml = esc(r.name || '—') +
          (r.checkedBy ? ' <span style="color:var(--slate);font-weight:500;">(Checked by: ' + esc(r.checkedBy) + ')</span>' : '') +
          ' — <span class="code">' + esc(r.code) + '</span>';
      } else if (s.id === 'courier') {
        var cname = getRecordEmpName(s.id, r) || '—';
        titleHtml = esc(cname) +
          (r.clientName ? ' <span style="color:var(--slate);font-weight:500;">(' + esc(r.clientName) + ')</span>' : '') +
          ' — <span class="code">' + esc(r.code) + '</span>';
      } else if (s.id === 'materialin') {
        titleHtml = esc(r.item || '—') +
          (r.checkedBy ? ' <span style="color:var(--slate);font-weight:500;">(Checked by: ' + esc(r.checkedBy) + ')</span>' : '') +
          ' — <span class="code">' + esc(r.code) + '</span>';
      } else {
        var name = getRecordEmpName(s.id, r) || '—';
        var empId = r.empId || '—';
        titleHtml = esc(name) + ' <span style="color:var(--slate);font-weight:500;">(ID: ' + esc(empId) + ')</span> — <span class="code">' + esc(r.code) + '</span>';
      }
      return '<div class="gresult-row" onclick="openGlobalDetail(' + i + ')">' +
        '<span class="source-badge ' + s.id + '">' + s.icon + ' ' + esc(s.title) + '</span>' +
        '<div class="gresult-main">' +
        '<span class="gresult-title">' + titleHtml + '</span>' +
        '<span class="gresult-sub">' + (esc(sub) || '&nbsp;') + '</span>' +
        '</div>' +
        '<span class="badge" style="' + badgeStyle(r.status) + '">' + m.icon + ' ' + esc(r.status) + '</span>' +
        '</div>';
    }).join('') + '<div class="gresult-count-pill" style="margin:8px 14px;display:inline-block;">' + matches.length + ' match' + (matches.length === 1 ? '' : 'es') + ' across ' + (new Set(matches.map(function (x) { return x.section.id; }))).size + ' sheet(s)</div>';
  }

  /* ============================================================
   * ACTIVITY LOG REAL-TIME SYNC
   * Activity Logs are independent from the normal 30s dashboard
   * refresh. Every open dashboard checks the shared Activity_Log
   * every 2 seconds. It only downloads the full log when the
   * server reports that a new row/timestamp exists.
   * ============================================================ */
  var activityLogRealtimeIntervalId = null;
  var activityLogRealtimeBusy = false;
  var activityLogVersion = { lastRow: 0, lastTimestampMs: 0 };

  function startActivityLogRealtimeSync_() {
    if (activityLogRealtimeIntervalId) clearInterval(activityLogRealtimeIntervalId);
    activityLogRealtimeIntervalId = setInterval(checkActivityLogRealtime_, 2000);
    checkActivityLogRealtime_();
  }

  function checkActivityLogRealtime_() {
    if (activityLogRealtimeBusy) return;
    activityLogRealtimeBusy = true;

    google.script.run
      .withSuccessHandler(function (version) {
        if (!version) {
          activityLogRealtimeBusy = false;
          return;
        }

        var changed =
          Number(version.lastRow || 0) !== Number(activityLogVersion.lastRow || 0) ||
          Number(version.lastTimestampMs || 0) !== Number(activityLogVersion.lastTimestampMs || 0);

        if (!changed) {
          activityLogRealtimeBusy = false;
          return;
        }

        google.script.run
          .withSuccessHandler(function (data) {
            activityLogRealtimeBusy = false;
            if (!data || data.error) return;

            SHEET_DATA.activity_logs = data;
            activityLogVersion = version;

            if (SECTION_STATE.activity_logs) {
              SECTION_STATE.activity_logs.data = data;
            }

            // Only repaint when the Activity Logs section is currently open.
            if (activeSection === 'activity_logs') {
              var section = activeWorkspace && activeWorkspace.sections ?
                activeWorkspace.sections.filter(function (x) { return x.id === 'activity_logs'; })[0] : null;

              if (section) {
                onSectionData(section, data);
              }
            }
          })
          .withFailureHandler(function () {
            activityLogRealtimeBusy = false;
          })
          .getActivityLog({});
      })
      .withFailureHandler(function () {
        activityLogRealtimeBusy = false;
      })
      .getActivityLogVersion();
  }

  function stopActivityLogRealtimeSync_() {
    if (activityLogRealtimeIntervalId) {
      clearInterval(activityLogRealtimeIntervalId);
      activityLogRealtimeIntervalId = null;
    }
  }

/* ============================================================
   * AUTO-REFRESH — every 59 seconds, silently re-pull data for
   * every section of the OPEN workspace, update counts/charts/
   * tables in place, and show a small toast + flash animation so
   * it feels alive.
   * ------------------------------------------------------------
   * FIX: since openWorkspace() now always rebuilds and calls
   * startAutoRefresh() again, we track the running interval id
   * and clear any previous one first — otherwise switching
   * between workspaces would stack up multiple refresh timers.
   * ============================================================ */
  var autoRefreshIntervalId = null;
  function startAutoRefresh() {
    if (autoRefreshIntervalId) clearInterval(autoRefreshIntervalId);
    refreshCountdown = AUTO_REFRESH_SECONDS;
    updateRefreshUI();
    autoRefreshIntervalId = setInterval(function () {
      if (!activeWorkspace) return;
      refreshCountdown--;
      if (refreshCountdown <= 0) {
        refreshCountdown = AUTO_REFRESH_SECONDS;
        refreshAllSections();
      }
      updateRefreshUI();
    }, 1000);
  }

  function updateRefreshUI() {
    var label = document.getElementById('refreshLabel');
    var ring = document.getElementById('ringFg');
    if (!label || !ring) return;
    label.textContent = 'Refreshing in ' + refreshCountdown + 's';
    var fraction = refreshCountdown / AUTO_REFRESH_SECONDS;
    ring.setAttribute('stroke-dashoffset', String(RING_CIRCUMFERENCE * (1 - fraction)));
  }

  function manualRefresh() {
    refreshCountdown = AUTO_REFRESH_SECONDS;
    refreshAllSections();
  }

  function refreshAllSections() {
    if (!activeWorkspace) return;
    var SECTIONS_LOCAL = activeWorkspace.sections;
    var badge = document.getElementById('refreshBadge');
    var icon = document.getElementById('ringIcon');
    if (badge) badge.classList.add('spinning');
    if (icon) icon.textContent = '⏳';

    var pending = SECTIONS_LOCAL.length;
    SECTIONS_LOCAL.forEach(function (s) {
      google.script.run
        .withSuccessHandler(function (data) {
          silentApplyData(s, data);
          pending--;
          if (pending === 0) finishRefreshUI();
        })
        .withFailureHandler(function () {
          pending--;
          if (pending === 0) finishRefreshUI();
        })
        [s.fetchFn]();
    });
  }

  function finishRefreshUI() {
    var badge = document.getElementById('refreshBadge');
    var icon = document.getElementById('ringIcon');
    if (badge) badge.classList.remove('spinning');
    if (icon) icon.textContent = '🔄';
    showToast('Dashboard refreshed ✓');
  }

  function silentApplyData(s, data) {
    if (data.error || !SECTION_STATE[s.id]) return;
    SHEET_DATA[s.id] = data;
    var oldState = SECTION_STATE[s.id];
    var wasFilter = oldState.currentFilter;
    var wasStatusFilter = oldState.statusFilter;
    var wasOpen = document.getElementById('records-' + s.id) &&
                  document.getElementById('records-' + s.id).style.display === 'block';

    SECTION_STATE[s.id].data = data;
    data._loadedAt = Date.now();
    if (!data._search) data._search = (data.records || []).map(function(r){ return (String(r.empId||'') + " " + getRecordEmpName(s.id,r) + " " + String(r.code||'') + " " + getRecordExtraHaystack(s.id,r)).toUpperCase(); });
    SECTION_STATE[s.id].currentFilter = wasFilter;
    SECTION_STATE[s.id].statusFilter = wasStatusFilter;

    var tabCountEl = document.getElementById('tabcount-' + s.id);
    if (tabCountEl) tabCountEl.textContent = data.total;

    if (s.id === activeSection) {
      document.getElementById('globalUpdated').innerHTML = '<span class="dot"></span>' + s.title + ' updated ' + data.updated;
    }

    // update each stat card value with a flash + count-up animation
    var counts = data.counts;
    var allCard = document.querySelector('#section-' + s.id + ' .card[data-status="__ALL__"] .value');
    if (allCard) {
      animateValue(allCard, data.total, 600);
      allCard.closest('.card').classList.add('just-updated');
      setTimeout(function () { allCard.closest('.card').classList.remove('just-updated'); }, 1200);
    }
    Object.keys(counts).forEach(function (l) {
      var card = document.querySelector('#section-' + s.id + ' .card[data-status="' + CSS.escape(l) + '"]');
      if (card) {
        var valEl = card.querySelector('.value');
        animateValue(valEl, counts[l], 600);
        card.classList.add('just-updated');
        setTimeout(function () { card.classList.remove('just-updated'); }, 1200);
      }
    });

    if (s.showCharts) renderCharts(s);
    if (wasOpen || s.flatList) renderTable(s.id);

    if (s.statusFilterField) {
      var sfCounts = {};
      (data.records || []).forEach(function (r) {
        var key = String(r[s.statusFilterField] || 'UNKNOWN').trim().toUpperCase();
        sfCounts[key] = (sfCounts[key] || 0) + 1;
      });
      if (s.statusFilterType === 'dropdown') {
        var dropdown = document.getElementById('statusDropdown-' + s.id);
        if (dropdown) {
          var currentVal = dropdown.value;
          var optsHtml = '<option value="__ALL__">All ' + esc(s.statusFilterLabel || 'Items') + ' (' + data.total + ')</option>';
          Object.keys(sfCounts).forEach(function (l) {
            var m = metaFor(l);
            optsHtml += '<option value="' + esc(l) + '">' + m.icon + ' ' + esc(l) + ' (' + sfCounts[l] + ')</option>';
          });
          dropdown.innerHTML = optsHtml;
          dropdown.value = currentVal;
        }
      } else {
        var allChip = document.querySelector('#statusFilter-' + s.id + ' .status-chip[data-sf="__ALL__"] .chip-count');
        if (allChip) allChip.textContent = data.total;
        Object.keys(sfCounts).forEach(function (l) {
          var chip = document.querySelector('#statusFilter-' + s.id + ' .status-chip[data-sf="' + CSS.escape(l) + '"] .chip-count');
          if (chip) chip.textContent = sfCounts[l];
        });
      }
    }

    var gInput = document.getElementById('globalSearchInput');
    if (gInput && gInput.value.trim()) onGlobalSearch();
  }

      .withSuccessHandler(function (result) {
        if (!result || !result.ok) {
          saveButton.disabled = false;

        saveButton.textContent = 'Add Laptop';

      })
      .addOfficeLaptop(payload);
  }

  function officeAssignmentDateInput_(value) {
    var text = String(value || '').trim();
    var monthMap = { JAN: 0, FEB: 1, MAR: 2, APR: 3, MAY: 4, JUN: 5, JUL: 6, AUG: 7, SEP: 8, OCT: 9, NOV: 10, DEC: 11 };
    var match = text.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
    var date;
    if (match && monthMap.hasOwnProperty(match[2].toUpperCase())) {
      date = new Date(Number(match[3]), monthMap[match[2].toUpperCase()], Number(match[1]));
    } else {
      match = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      date = match ? new Date(Number(match[3]), Number(match[2]) - 1, Number(match[1])) : new Date(text);
    }
    if (!text || isNaN(date.getTime())) return '';
    return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
  }

  function officeAssignmentTodayInput_() {
    var today = new Date();
    return today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
  }

  function handleOfficeAssignmentStatusChange_() {

    if (status && assignDate && status.value === 'ASSIGNED') {
      // Every time ASSIGNED is selected, start with today's date. The user can
      // still change it manually before saving if a different date is needed.
      assignDate.value = officeAssignmentTodayInput_();
      if (remarks) remarks.value = 'DONE';

  function officeAssignmentStatusOptions_(currentStatus) {
    var current = String(currentStatus || '').trim().toUpperCase();
    var statuses = OFFICE_LAPTOP_STATUS_OPTIONS_.slice();
    var placeholder = '';
    if (statuses.indexOf(current) === -1) {
      current = '';
      placeholder = '<option value="" disabled selected>Select Asset Status</option>';
    }
    return placeholder + statuses.map(function (status) {
      return '<option value="' + esc(status) + '"' + (status === current ? ' selected' : '') + '>' + esc(status) + '</option>';
    }).join('');
  }

  function getOfficeEmployeeMatches_(query) {
    var macData = SHEET_DATA.mac_office;
    var queryText = String(query || '').trim().toUpperCase();
    if (!queryText || !macData || !Array.isArray(macData.records)) return [];

    var seen = {};
    var matches = [];
    macData.records.forEach(function (record) {
      var empId = String(record.empId || '').trim();
      var empName = String(record.empName || '').trim();
      var key = empId.toUpperCase();
      if (!empId || !empName || seen[key] || (empId.toUpperCase().indexOf(queryText) === -1 && empName.toUpperCase().indexOf(queryText) === -1)) return;
      seen[key] = true;
      matches.push({ empId: empId, empName: empName });
    });
    return matches.slice(0, 8);
  }

  function applyOfficeAssignmentResult_(payload, status) {
    var data = SHEET_DATA.office;
    if (!data || !Array.isArray(data.records)) return;

    var record = data.records.find(function (item) {
      return String(item.code || '').trim().toUpperCase() ===
        String(payload.assetCode || '').trim().toUpperCase();
    });
    if (!record) return;

    var oldStatus = String(record.status || 'UNKNOWN').trim().toUpperCase();
    record.empId = payload.empId;
    record.empName = payload.empName;
    record.date = officeAssignmentDisplayDate_(payload.assignDate);
    record.remarks = payload.remarks;
    record.notes = payload.notes;
    record.status = status;

    data.counts = data.counts || {};
    if (oldStatus !== status) {
      data.counts[oldStatus] = Math.max(0, (data.counts[oldStatus] || 1) - 1);
      if (data.counts[oldStatus] === 0) delete data.counts[oldStatus];

  function saveOfficeAssignment_() {
    var record = OFFICE_ASSIGNMENT_RECORD_;
    if (!record) return;

    var payload = {
      assetCode: record.code,
      status: document.getElementById('officeAssignStatus').value,
      empId: document.getElementById('officeAssignEmpId').value.trim(),
      empName: document.getElementById('officeAssignEmpName').value.trim(),
      assignDate: document.getElementById('officeAssignDate').value,
      remarks: document.getElementById('officeAssignRemarks').value.trim(),
      notes: document.getElementById('officeAssignNotes').value.trim()
    };

    // Mirror the server-side status rules before the optimistic UI update.
    if (payload.status === 'NOT ASSIGNED') {
      payload.empId = '';
      payload.empName = '';
      payload.assignDate = '';
      payload.remarks = 'Ready to Assign';
      payload.notes = '';
    } else if (payload.status === 'ASSIGNED') {
      if (!payload.assignDate) payload.assignDate = officeAssignmentTodayInput_();
      payload.remarks = 'DONE';
    }

    var isSubmit = payload.status === 'NOT ASSIGNED';
    var optimisticStatus = payload.status;

    // Close the form and update its displayed record immediately. The sheet
    // write continues through google.script.run in the background.
    applyOfficeAssignmentResult_(payload, optimisticStatus);
    closeModal();
    showToast(isSubmit
      ? 'Submitting ' + payload.assetCode + '…'
      : 'Saving ' + payload.assetCode + '…');

    google.script.run
      .withSuccessHandler(function (result) {
        if (!result || !result.ok) {
          showToast((result && result.message) || 'Could not save the asset. Please try again.');
          refreshOfficeDataInBackground_();
          return;
        }

        // Keep the browser aligned with the server-side status, then refresh
        // all Office_Laptops rows independently in the background.
        applyOfficeAssignmentResult_(payload, result.status);
        showToast(result.submitted
          ? 'Asset ' + result.assetCode + ' submitted ✓'
          : 'Asset ' + result.assetCode + ' assigned ✓');
        refreshOfficeDataInBackground_();
      })
      .withFailureHandler(function (error) {
        showToast('Save failed: ' + ((error && error.message) || 'Please try again.'));
        refreshOfficeDataInBackground_();
      })
      .assignOfficeLaptop(payload);
  }

  function clientLaptopEditDate_(value) {
    var text = String(value || '').trim();
    if (!text) return '';
    var monthMap = { JAN: 0, FEB: 1, MAR: 2, APR: 3, MAY: 4, JUN: 5, JUL: 6, AUG: 7, SEP: 8, OCT: 9, NOV: 10, DEC: 11 };
    var match = text.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
    var date;
    if (match && monthMap.hasOwnProperty(match[2].toUpperCase())) {
      date = new Date(Number(match[3]), monthMap[match[2].toUpperCase()], Number(match[1]));
    } else {
      match = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      date = match ? new Date(Number(match[3]), Number(match[2]) - 1, Number(match[1])) : new Date(text);
    }
    if (!text || isNaN(date.getTime())) return '';
    return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
  }
